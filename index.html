<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knife Thrower</title>
<link rel="manifest" href="/knife-thrower.webmanifest">
<link rel="apple-touch-icon" href="/icons/knife-thrower-180.png">
<meta name="theme-color" content="#0b0e14">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1a2030, #0b0e14);
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    font-family: "Segoe UI", system-ui, sans-serif; color: #dfe6f2;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  canvas {
    display: block; border-radius: 10px;
    width: min(calc(100vw - 32px), calc((100vh - 72px) * 16 / 9));
    height: auto; aspect-ratio: 16 / 9;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    background: #10131a;
    cursor: none; touch-action: none;
  }
  #controls {
    font-size: 12px; opacity: .55; letter-spacing: 1px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding: 0 16px;
  }
  kbd {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    border-radius: 4px; padding: 1px 6px; font-family: inherit; margin: 0 1px;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
  <span><kbd>Mouse</kbd> aim</span>
  <span><kbd>Click</kbd> throw (hold = power)</span>
  <span><kbd>Right-click</kbd>/<kbd>Space</kbd> deflect incoming knives</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>M</kbd> mute</span>
</div>

<script>
"use strict";
// ======================================================================
//  KNIFE THROWER — first person. Aim, charge, throw. Deflect knives
//  tossed at you, clear waves before they reach you, and chase high
//  scores on the target range.
// ======================================================================

// ============ CONSTANTS ============
const W = 960, H = 540;
const CX = W / 2, HOR = 248;   // screen centre / horizon line
const F = 600;                 // focal length: pixels per metre at 1 m
const EYE = 1.6;               // camera height in metres
const DT = 1 / 60;
const TAU = Math.PI * 2;
const FONT = "'Segoe UI', system-ui, sans-serif";
const ARENA_Z = 36;            // back fence
const MELEE_Z = 2.2;           // distance a rusher swipes from
const HOLD_Z = 4.6;            // where attackers wait their turn

const KNIFE = {
  speed: 24, powerSpeed: 36,   // m/s
  gravity: 2.2,                // gentle drop: long throws need a little lift
  chargeDelay: 0.1, chargeTime: 0.42,
  cooldown: 0.16,
  returnTime: 2.2,             // missed knives come back to the belt after this
};
const DEFLECT = { time: 0.22, cooldown: 0.4, deflectZ: 6.5, deflectPx: 140 };
const MAX_HP = 5;
const RANGE_TIME = 60;

const TYPES = {
  grunt:   { name: "Grunt",   hp: 2, speed: 2.2, sc: 1.0,  color: "#c96b3c", score: 100, melee: true, windup: 0.85, idle: [0.9, 1.6], dmg: 1 },
  runner:  { name: "Runner",  hp: 1, speed: 4.0, sc: 0.92, color: "#d94a4a", score: 150, melee: true, windup: 0.7,  idle: [0.6, 1.1], dmg: 1 },
  thrower: { name: "Thrower", hp: 2, speed: 1.5, sc: 1.0,  color: "#5fae6a", score: 200, ranged: true, dmg: 1 },
  shield:  { name: "Shield",  hp: 2, speed: 1.7, sc: 1.05, color: "#8a9bb5", score: 250, melee: true, shield: true, windup: 0.8, idle: [1.0, 1.6], dmg: 1 },
  brute:   { name: "Brute",   hp: 6, speed: 1.4, sc: 1.25, color: "#8d5cc4", score: 400, melee: true, windup: 0.95, idle: [1.2, 1.8], dmg: 2, combo: 0.45 },
  ace:     { name: "Ace",     hp: 3, speed: 1.4, sc: 1.0,  color: "#d6b25e", score: 500, ranged: true, dmg: 1, throwGap: [1.4, 2.2] },
};
const WAVE_INTRO = {
  1: "Throw them down before they reach you",
  2: "Runners — fast and fragile, lead your throws",
  3: "Throwers — right-click their knives to send them back",
  4: "Shield bearers — aim for the head, or power-throw the shield",
  5: "Brutes — soak hits; headshots still drop them fast",
};
const NEW_TYPE = { 2: "runner", 3: "thrower", 4: "shield", 5: "brute" };
const ACES = [
  ["Rook", "#d6b25e"], ["Viper", "#5fc49a"], ["Mako", "#5c8fd6"], ["Jinx", "#d65cb0"],
  ["Sable", "#9aa3b5"], ["Kestrel", "#d68a3c"], ["Ghost", "#e8e8f0"], ["Brand", "#d64a3c"],
];

// ============ HELPERS ============
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function weighted(table) {          // [[item, weight], ...]
  let sum = 0;
  for (const [, w] of table) sum += w;
  let r = Math.random() * sum;
  for (const [item, w] of table) if ((r -= w) <= 0 && w > 0) return item;
  return table[0][0];
}
function inRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
function loadBest(key) { try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; } }
function saveBest(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) { /* storage unavailable */ } }

// Kaotic Gaming site (window.KG is injected when played at /play/knife-thrower)
const siteMode = () => !!window.KG;
function mergeCloudBests() {
  if (!siteMode()) return;
  const cloud = window.KG.initialSave && window.KG.initialSave.best;
  if (!cloud) return;
  for (const m of ["fight", "range", "duel"]) {
    if (typeof cloud[m] === "number") game.best[m] = Math.max(game.best[m] || 0, cloud[m]);
  }
}
function persistBests() {
  for (const m of ["fight", "range", "duel"]) saveBest("kf_best_" + m, game.best[m] || 0);
  if (!siteMode()) return;
  window.KG.save({
    best: { fight: game.best.fight, range: game.best.range, duel: game.best.duel },
    kills: Math.max((window.KG.initialSave && window.KG.initialSave.kills) || 0, game.stats.kills || 0),
    heads: Math.max((window.KG.initialSave && window.KG.initialSave.heads) || 0, game.stats.heads || 0),
  });
}
function reportProgress() {
  if (!siteMode()) return;
  const lifetime = window.KG.initialSave || {};
  window.KG.report({
    waveBest: game.best.fight,
    rangeBest: game.best.range,
    throwdownBest: game.best.duel,
    kills: Math.max(lifetime.kills || 0, game.stats.kills || 0),
    heads: Math.max(lifetime.heads || 0, game.stats.heads || 0),
  });
}
function siteStatus() {
  if (!siteMode() || game.state !== "play") return;
  if (game.mode === "fight") window.KG.setStatus(`Wave ${game.wave} · score ${game.score.toLocaleString()}`);
  else if (game.mode === "duel") window.KG.setStatus(`Throwdown ${game.duelN} · score ${game.score.toLocaleString()}`);
  else window.KG.setStatus(`Range · ${Math.ceil(game.time)}s · ${game.score.toLocaleString()}`);
}
const HOME_BTN = { x: 22, y: 18, w: 100, h: 32 };

// World (x right, y up from the ground, z away from you) → screen.
function proj(x, y, z) {
  const s = F / Math.max(z, 0.08);
  return { x: CX + x * s, y: HOR - (y - EYE) * s, s };
}

// ============ INPUT ============
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const keys = {}, pressed = {};
const mouse = { x: CX, y: HOR + 40, down: false, pressed: false, released: false, rpressed: false };

addEventListener("keydown", e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false; game.charging = false;
  if (game.state === "play") game.state = "paused";
});
function trackPointer(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
addEventListener("pointermove", trackPointer);
canvas.addEventListener("pointerdown", e => {
  trackPointer(e);
  sfx.ensure();
  if (e.button === 2) mouse.rpressed = true;
  else if (e.button === 0) { mouse.down = true; mouse.pressed = true; }
  e.preventDefault();
});
addEventListener("pointerup", e => {
  if (e.button === 0 && mouse.down) { mouse.down = false; mouse.released = true; }
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
function clearInput() {
  for (const k in pressed) delete pressed[k];
  mouse.pressed = mouse.released = mouse.rpressed = false;
}

// ============ AUDIO (synthesized, no assets) ============
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.45;
        master.connect(ac.destination);
      } catch (e) { ac = null; return; }
    }
    if (ac.state === "suspended") ac.resume();
  }
  function tone(freq, dur, { type = "sine", vol = 0.2, slide = 0, delay = 0 } = {}) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, { vol = 0.2, freq = 1000, q = 1, filter = "bandpass", slide = 0, delay = 0 } = {}) {
    if (!ac || muted) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = filter; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (slide) f.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.03);
  }
  const notes = (list, o) => list.forEach((f, i) => tone(f, o.dur, { ...o, delay: i * o.step }));
  return {
    ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; },
    whoosh(power) {
      noise(power ? 0.2 : 0.14, { vol: 0.2, freq: 700, slide: power ? 4200 : 3000, q: 1.4 });
      if (power) tone(160, 0.18, { type: "sawtooth", vol: 0.05, slide: 420 });
    },
    incoming() { noise(0.25, { vol: 0.12, freq: 2400, slide: 900, q: 2 }); },
    thunk() { tone(170, 0.09, { type: "triangle", vol: 0.32, slide: 70 }); noise(0.05, { vol: 0.2, freq: 700, filter: "lowpass" }); },
    dirt() { noise(0.07, { vol: 0.16, freq: 450, filter: "lowpass" }); tone(110, 0.06, { vol: 0.14, slide: 60 }); },
    clank() {
      tone(1250, 0.16, { type: "square", vol: 0.05, slide: 1050 });
      tone(1900, 0.13, { type: "triangle", vol: 0.08 });
      noise(0.04, { vol: 0.14, freq: 5000, filter: "highpass" });
    },
    hit() { noise(0.09, { vol: 0.3, freq: 520, filter: "lowpass" }); tone(210, 0.08, { type: "square", vol: 0.07, slide: 90 }); },
    headshot() { this.hit(); tone(900, 0.14, { vol: 0.14, slide: 1600, delay: 0.03 }); },
    pop() { noise(0.07, { vol: 0.35, freq: 2200, q: 0.7 }); tone(520, 0.05, { vol: 0.14, slide: 160 }); },
    shatter() { noise(0.22, { vol: 0.3, freq: 4200, q: 0.6 }); tone(2400, 0.08, { type: "triangle", vol: 0.06, slide: 3200 }); },
    crack() { noise(0.16, { vol: 0.3, freq: 900, q: 0.8 }); tone(140, 0.12, { type: "triangle", vol: 0.2, slide: 60 }); },
    coin() { tone(1320, 0.08, { type: "square", vol: 0.05 }); tone(1980, 0.18, { type: "square", vol: 0.05, delay: 0.07 }); },
    bullseye() { tone(1047, 0.14, { type: "triangle", vol: 0.14 }); tone(1568, 0.22, { type: "triangle", vol: 0.12, delay: 0.07 }); },
    hurt() { tone(240, 0.28, { type: "sawtooth", vol: 0.14, slide: 80 }); noise(0.12, { vol: 0.2, freq: 300, filter: "lowpass" }); },
    empty() { tone(320, 0.05, { type: "square", vol: 0.05 }); tone(240, 0.05, { type: "square", vol: 0.05, delay: 0.06 }); },
    slash() { noise(0.1, { vol: 0.2, freq: 2500, slide: 6000, filter: "highpass" }); },
    swing() { noise(0.18, { vol: 0.2, freq: 900, slide: 2600, q: 1.2 }); },
    ready() { tone(700, 0.06, { type: "square", vol: 0.03 }); },
    guard() { noise(0.06, { vol: 0.08, freq: 1500 }); },
    parry() {
      tone(1800, 0.3, { type: "triangle", vol: 0.14 });
      tone(2700, 0.2, { vol: 0.08, delay: 0.01 });
      noise(0.06, { vol: 0.22, freq: 6000, filter: "highpass" });
    },
    block() { tone(800, 0.12, { type: "square", vol: 0.05, slide: 600 }); noise(0.05, { vol: 0.18, freq: 3000, filter: "highpass" }); },
    deflect() { this.clank(); tone(900, 0.16, { type: "triangle", vol: 0.1, slide: 1800 }); },
    tick() { tone(1400 + Math.random() * 400, 0.03, { vol: 0.05 }); },
    wave() { notes([523, 659, 784], { type: "triangle", vol: 0.1, dur: 0.12, step: 0.09 }); },
    clear() { notes([523, 659, 784, 1047], { type: "triangle", vol: 0.11, dur: 0.14, step: 0.08 }); },
    over() { notes([392, 330, 262, 196], { type: "triangle", vol: 0.12, dur: 0.22, step: 0.16 }); },
  };
})();

// ============ EFFECTS (screen space) ============
function burst(x, y, n, color, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(o.min || 1.5, o.max || 6);
    game.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
      life: rand(0.35, 0.7) * (o.life || 1), age: 0, color, size: rand(1.5, 3.5) * (o.size || 1), grav: o.grav ?? 0.25,
    });
  }
}
function popup(x, y, str, color = "#dfe6f2", size = 18) {
  game.popups.push({ x, y, str, color, size, t: 0 });
}

// ============ KNIVES ============
class Knife {
  constructor(o) {
    this.x = o.x; this.y = o.y; this.z = o.z;
    this.vx = o.vx; this.vy = o.vy; this.vz = o.vz;
    this.owner = o.owner;          // "player" | "enemy"
    this.mine = !!o.mine;          // goes back on your belt eventually
    this.power = !!o.power;
    this.src = o.src || null;      // enemy who threw it
    this.from = o.from || null;    // screen point it left the hand from
    this.deflected = false;
    this.state = "fly";            // fly | stuck | fall | gone
    this.age = 0; this.timer = 0;
    this.spin = rand(0, TAU);      // only used once a knife bounces off and tumbles
    this.host = null; this.lx = 0; this.ly = 0; this.onShield = false;
    this.tilt = { x: rand(-0.7, 0.7), y: rand(0.15, 0.8) };
    this.trail = [];
    this.warned = false;
  }
  update() {
    this.age += DT;
    if (this.state === "fly") this.fly();
    else if (this.state === "stuck") {
      if (this.host.kind === "ground" || this.host.kind === "wall") {
        this.timer += DT;
        if (this.timer > KNIFE.returnTime) this.retire();
      }
    } else if (this.state === "fall") {
      this.vy -= 9.8 * DT;
      this.x += this.vx * DT; this.y += this.vy * DT; this.z += this.vz * DT;
      this.spin += 12 * DT; this.timer += DT;
      if (this.y < 0) { this.y = 0; this.vy *= -0.3; this.vx *= 0.5; this.vz *= 0.5; }
      if (this.timer > 1) this.retire();
    }
  }
  retire() {
    if (this.state === "gone") return;
    this.state = "gone";
    if (this.mine) game.returnKnife();
  }
  bounce() {
    this.state = "fall"; this.timer = 0;
    this.vx = rand(-2, 2); this.vy = rand(1.5, 3); this.vz = rand(-1.5, -0.5);
  }
  stickTo(host, lx, ly, onShield = false) {
    this.state = "stuck"; this.host = host; this.lx = lx; this.ly = ly; this.onShield = onShield;
    this.tilt.x = clamp(-this.vx / 12 + rand(-0.3, 0.3), -0.8, 0.8);
  }
  fly() {
    const N = 4, h = DT / N;
    const sp = proj(this.x, this.y, this.z);
    this.trail.push({ x: sp.x, y: sp.y });
    if (this.trail.length > 6) this.trail.shift();
    if (this.owner === "enemy" && !this.warned && this.z < 7) { this.warned = true; sfx.incoming(); }
    for (let i = 0; i < N && this.state === "fly"; i++) {
      const px = this.x, py = this.y, pz = this.z;
      this.vy -= KNIFE.gravity * h;
      this.x += this.vx * h; this.y += this.vy * h; this.z += this.vz * h;
      if (this.owner === "player") {
        if (this.collide(px, py, pz)) return;
      } else if (this.z <= 0.3) {
        this.state = "gone";
        game.hurt(1, "C");
        return;
      }
      if (this.y <= 0) {
        const t = py / (py - this.y || 1e-6);
        this.x = px + (this.x - px) * t; this.z = pz + (this.z - pz) * t; this.y = 0;
        if (this.owner === "player") {
          this.stickTo({ kind: "ground" }, 0, 0);
          sfx.dirt(); if (!this.scored) game.miss();
          const p = proj(this.x, 0, this.z);
          burst(p.x, p.y, 5, "#6b5440", { max: 2.5, size: 0.8 });
        } else this.bounce();
        return;
      }
      if (this.z >= ARENA_Z - 0.05) {
        this.z = ARENA_Z - 0.05;
        this.stickTo({ kind: "wall" }, 0, 0);
        sfx.thunk(); if (!this.scored) game.miss();
        return;
      }
      if (this.z > 80 || this.z < -2 || Math.abs(this.x) > 40) { this.retire(); return; }
    }
  }
  collide(px, py, pz) {
    let best = null;
    for (const list of [game.enemies, game.targets]) {
      for (const o of list) {
        const hit = o.intersect(px, py, pz, this.x, this.y, this.z);
        if (hit && (!best || hit.z < best.z)) best = hit;
      }
    }
    if (!best) return false;
    const consumed = best.obj.onKnife(this, best) !== false;
    if (!consumed) this.scored = true;   // passed through a balloon / bottle / coin
    return consumed;
  }
  draw() {
    if (this.state === "gone") return;
    const p = proj(this.x, this.y, this.z);
    if (this.state === "stuck") {
      ctx.save();
      ctx.globalAlpha = 1 - clamp((this.timer - KNIFE.returnTime + 0.4) / 0.4, 0, 1);
      drawStuckKnife(p.x, p.y, p.s, this.tilt);
      ctx.restore();
      return;
    }
    let x = p.x, y = p.y;
    if (this.from && this.owner === "player" && !this.deflected) {
      const u = clamp(this.age / 0.2, 0, 1), w = (1 - u) * (1 - u);
      x = lerp(x, this.from.x, w); y = lerp(y, this.from.y, w);
    }
    const scale = clamp(p.s * 0.3 / 28, 0.45, 4.2);   // floor keeps far knives easy to follow
    const hostile = this.owner === "enemy";
    if (this.state === "fly" && (this.power || this.deflected) && this.trail.length > 2) {
      ctx.strokeStyle = this.deflected ? "rgba(111,211,255,.5)" : "rgba(255,157,92,.5)";
      ctx.lineWidth = Math.max(1.5, scale * 2); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (const q of this.trail) ctx.lineTo(q.x, q.y);
      ctx.lineTo(x, y); ctx.stroke();
    }
    if (hostile && this.state === "fly" && this.z < 9) {
      const pulse = 0.5 + 0.5 * Math.sin(game.t * 22);
      ctx.strokeStyle = `rgba(255,70,80,${0.45 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 18 + scale * 14, 0, TAU); ctx.stroke();
    }
    let ang = this.spin, stretch = 1;
    if (this.state === "fly") {
      // Point-first. Your own throws point along the line from your hand, so they read as flying
      // away from you; everything else points along its on-screen path (tip leading).
      if (this.from && this.owner === "player" && !this.deflected) {
        ang = Math.atan2(p.y - this.from.y, p.x - this.from.x);
        stretch = clamp(1 - this.age * 0.9, 0.6, 1);
      } else {
        const v = Math.hypot(this.vx, this.vy, this.vz) || 1, L = 0.3;
        const q = proj(this.x + this.vx / v * L, this.y + this.vy / v * L, this.z + this.vz / v * L);
        const len = Math.hypot(q.x - p.x, q.y - p.y);
        if (len > 0.5) this.lastAng = Math.atan2(q.y - p.y, q.x - p.x);
        ang = this.lastAng ?? -Math.PI / 2;
        stretch = clamp(len / (L * p.s), 0.6, 1);
      }
    }
    const glow = this.state !== "fly" ? null : hostile ? "#ff4d5a" : this.deflected ? "#6fd3ff" : this.power ? "#ff9d5c" : null;
    drawKnife(ctx, x, y, ang, { scale, glow, stretch });
  }
}

// ============ ENEMIES ============
const SHIELD = { x: -0.2, y: 1.1, r: 0.32 };

class Enemy {
  constructor(key, x, z, over = {}) {
    this.key = key;
    this.t = { ...TYPES[key], ...over };
    this.x = x; this.z = z; this.sc = this.t.sc;
    this.hp = this.maxHp = this.t.hp;
    this.shieldHp = this.t.shield ? 3 : 0;
    this.state = "live";         // live | dying
    this.engaged = false; this.slot = -1;
    this.phase = "idle"; this.pt = 0; this.wt = 1; this.dir = "R";
    this.comboLeft = 0;
    this.alpha = 0; this.flash = 0; this.walk = rand(0, 6); this.age = 0; this.moving = true;
    this.laneX = rand(-2.6, 2.6); this.holdZ = HOLD_Z + rand(0, 1.8);
    this.standZ = rand(16, 22); this.throwT = rand(1.2, 2.2);
    this.dieT = 0; this.remove = false; this.flinch = 0;
  }
  get alive() { return this.state !== "dying"; }

  update() {
    this.age += DT;
    this.flash = Math.max(0, this.flash - DT);
    this.flinch = Math.max(0, this.flinch - DT);
    if (this.state === "dying") {
      this.dieT += DT;
      if (this.dieT > 0.9) this.remove = true;
      return;
    }
    this.alpha = Math.min(1, this.alpha + DT * 2.5);
    if (this.t.ranged) { this.updateRanged(); return; }
    if (!this.engaged) {
      if (this.slot < 0) this.slot = game.claimSlot(this);
      const tz = this.slot >= 0 ? MELEE_Z : this.holdZ;
      const tx = this.slot >= 0 ? game.slotX(this.slot) : this.laneX;
      this.moveTo(tx, tz);
      if (this.slot >= 0 && Math.abs(this.z - MELEE_Z) < 0.03 && Math.abs(this.x - tx) < 0.06) {
        this.engaged = true; this.phase = "idle"; this.pt = rand(0.35, 0.7);
      }
    } else {
      this.x = lerp(this.x, game.slotX(this.slot), 0.1);
      this.moving = false;
      this.walk += DT * 1.5;
      this.updateMelee();
    }
  }
  moveTo(tx, tz) {
    const sp = this.t.speed * DT;
    const dz = tz - this.z, dx = tx - this.x;
    this.z += clamp(dz, -sp, sp);
    this.x += clamp(dx, -sp * 0.6, sp * 0.6);
    this.moving = Math.abs(dz) > 0.01 || Math.abs(dx) > 0.01;
    this.walk += DT * (this.moving ? this.t.speed * 4.5 : 1.5);
  }
  updateMelee() {
    this.pt -= DT;
    switch (this.phase) {
      case "idle":
        if (this.pt <= 0) this.startWindup();
        break;
      case "windup":
        if (this.pt <= 0) this.strike();
        break;
      case "strike":
        if (this.pt <= 0) {
          if (this.comboLeft > 0) { this.comboLeft--; this.startWindup(0.7, true); }
          else { this.phase = "recover"; this.pt = 0.5; }
        }
        break;
      case "recover":
        if (this.pt <= 0) { this.phase = "idle"; this.pt = rand(...this.t.idle) * game.pace; }
        break;
    }
  }
  startWindup(mult = 1, force = false) {
    // Stagger rushers so they don't all swipe on the same frame.
    if (!force && game.enemies.some(e => e !== this && e.engaged && e.alive && e.phase === "windup")) {
      this.pt = 0.4; return;
    }
    this.phase = "windup";
    this.dir = weighted([["L", 2], ["R", 2], ["H", 1]]);
    this.wt = this.pt = (this.t.windup || 0.8) * game.pace * mult;
    if (!force) this.comboLeft = Math.random() < (this.t.combo || 0) ? 1 : 0;
    sfx.ready();
  }
  strike() {
    this.phase = "strike"; this.pt = 0.22;
    sfx.swing();
    game.hurt(this.t.dmg, this.dir);
  }

  updateRanged() {
    if (this.z > this.standZ + 0.02) { this.moveTo(this.laneX, this.standZ); return; }
    this.moving = false;
    this.walk += DT * 1.5;
    if (this.phase === "windup") {
      this.pt -= DT;
      if (this.pt <= 0) { this.throwKnife(); this.phase = "recover"; this.pt = 0.45; }
    } else if (this.phase === "recover") {
      this.pt -= DT;
      if (this.pt <= 0) this.phase = "idle";
    } else {
      this.throwT -= DT;
      const busy = game.knives.some(k => k.src === this && k.state === "fly" && k.owner === "enemy");
      if (this.throwT <= 0 && !busy) {
        this.phase = "windup"; this.dir = "R";
        this.wt = this.pt = 0.65 * game.pace;
        const gap = this.t.throwGap || [2.2, 3.4];
        this.throwT = rand(gap[0], gap[1]) * game.pace;
      }
    }
  }
  throwKnife() {
    const hx = this.x + 0.6 * this.sc, hy = 1.8 * this.sc, hz = this.z - 0.1;
    const tx = rand(-0.25, 0.25), ty = EYE - 0.1 + rand(-0.12, 0.08), tz = 0.15;
    const speed = Math.min(17, 12 + game.wave * 0.4);
    const T = Math.hypot(tx - hx, ty - hy, tz - hz) / speed;
    game.knives.push(new Knife({
      x: hx, y: hy, z: hz,
      vx: (tx - hx) / T, vy: (ty - hy) / T + 0.5 * KNIFE.gravity * T, vz: (tz - hz) / T,
      owner: "enemy", src: this,
    }));
    sfx.whoosh(false);
  }

  // Local (unscaled metres) position of the knife hand.
  handLocal() {
    if (this.state === "dying") return { x: 0.34, y: 1.0 };
    switch (this.phase) {
      case "windup":
        return this.dir === "L" ? { x: -0.6, y: 1.82 } : this.dir === "R" ? { x: 0.62, y: 1.8 } : { x: 0.1, y: 2.12 };
      case "strike": return { x: 0.05, y: 1.4 };
      default: return { x: 0.34, y: 1.05 + Math.sin(this.walk) * 0.02 };
    }
  }
  view() {
    const p = proj(this.x, 0, this.z);
    const S = p.s * this.sc;
    const dk = this.state === "dying" ? Math.min(1, this.dieT / 0.45) : 0;
    const squash = 1 - dk * 0.82;
    const ox = this.flinch * Math.sin(this.age * 60) * 0.25 * S;
    const bob = this.moving ? Math.abs(Math.sin(this.walk)) * 0.04 : Math.sin(this.walk) * 0.01;
    return { p, S, squash, ox, bob };
  }
  toScreen(lx, ly, v = this.view()) {
    return { x: v.p.x + v.ox + lx * v.S, y: v.p.y - (ly + v.bob) * v.S * v.squash };
  }
  handScreen() {
    const h = this.handLocal();
    return this.toScreen(h.x, h.y);
  }
  intersect(px, py, pz, x, y, z) {
    if (!this.alive || this.alpha < 0.5) return null;
    const planes = [];
    if (this.shieldHp > 0) planes.push(["shield", this.z - 0.28 * this.sc]);
    planes.push(["body", this.z]);
    for (const [part, z0] of planes) {
      if (!(pz - 0.15 < z0 && z >= z0)) continue;
      const t = clamp((z0 - pz) / (z - pz || 1e-6), 0, 1);
      const ix = px + (x - px) * t, iy = py + (y - py) * t;
      const lx = (ix - this.x) / this.sc, ly = iy / this.sc;
      if (part === "shield") {
        if (Math.hypot(lx - SHIELD.x, ly - SHIELD.y) < SHIELD.r) return { obj: this, part, z: z0, lx, ly };
        continue;
      }
      if (Math.hypot(lx, ly - 1.64) < 0.16) return { obj: this, part: "head", z: z0, lx, ly };
      if (Math.abs(lx) < 0.3 && ly > 0.84 && ly < 1.5) return { obj: this, part: "body", z: z0, lx, ly };
      if (Math.abs(lx) < 0.22 && ly >= 0 && ly <= 0.86) return { obj: this, part: "body", z: z0, lx, ly };
    }
    return null;
  }
  onKnife(k, hit) {
    const g = game;
    const sp = this.toScreen(hit.lx, hit.ly);
    if (hit.part === "shield") {
      k.stickTo(this, hit.lx, hit.ly, true);
      this.shieldHp--;
      sfx.clank();
      burst(sp.x, sp.y, 8, "#e8eef8", { max: 5 });
      if (this.shieldHp <= 0) {
        sfx.crack();
        popup(sp.x, sp.y - 20, "SHIELD BROKEN", "#a9b8d0", 18);
        for (const o of g.knives) if (o.host === this && o.onShield && o.state === "stuck") o.bounce();
        burst(sp.x, sp.y, 18, "#8a9bb5", { max: 7 });
      } else popup(sp.x, sp.y - 16, "BLOCKED", "#a9b8d0", 15);
      g.stats.hits++;
      return;
    }
    const head = hit.part === "head";
    let dmg = head ? 3 : k.power ? 2 : 1;
    if (k.deflected) dmg = 3;
    k.stickTo(this, hit.lx, hit.ly);
    g.stats.hits++;
    if (head) { g.stats.heads++; sfx.headshot(); } else sfx.hit();
    burst(sp.x, sp.y, head ? 14 : 8, "#c23b3b", { max: head ? 6 : 4, grav: 0.35 });
    // A solid hit interrupts their windup so you can finish them with another throw.
    if (this.phase === "windup" || this.phase === "strike") {
      this.phase = "recover"; this.pt = 0.55; this.comboLeft = 0;
    }
    this.hurt(dmg, { head, deflect: k.deflected, sx: sp.x, sy: sp.y });
  }
  hurt(dmg, info) {
    const g = game;
    this.hp -= dmg;
    this.flash = 0.12;
    g.bumpCombo();
    if (this.hp <= 0) { this.die(info); return; }
    this.flinch = 0.18;
    const label = info.head ? "HEADSHOT" : null;
    g.addScore(15, info.sx, info.sy - 20, label, "#ff9d9d", 16);
  }
  die(info) {
    const g = game;
    this.state = "dying"; this.dieT = 0;
    if (this.slot >= 0) { g.slots[this.slot] = null; this.slot = -1; }
    this.engaged = false;
    g.stats.kills++;
    let pts = this.t.score, label = "DOWN";
    if (info.head) { pts *= 1.5; label = "HEADSHOT"; }
    if (info.deflect) { pts += 150; label = "RETURN TO SENDER"; }
    g.addScore(Math.round(pts), info.sx, info.sy - 26, label, "#ffd84d", 22);
    sfx.crack();
    g.shake = Math.max(g.shake, 5);
  }
}

// ============ RANGE TARGETS ============
class Target {
  constructor(kind, o) {
    this.kind = kind;
    Object.assign(this, { x: 0, y: 1.4, z: 10, r: 0.42, vx: 0, vy: 0, life: 7, sway: 0, swaySpeed: 1 }, o);
    this.baseX = this.x;
    this.age = 0; this.rise = kind === "board" ? 0 : 1; this.down = 0;
    this.state = "up"; this.hits = 0; this.remove = false;
    this.spin = rand(0, TAU);
  }
  update() {
    this.age += DT;
    if (this.kind === "board") {
      if (this.state === "up") {
        this.rise = Math.min(1, this.rise + DT * 4);
        if (this.sway) this.x = this.baseX + Math.sin(this.age * this.swaySpeed) * this.sway;
        if (this.age > this.life || this.hits >= 3) this.state = "down";
      } else {
        this.down += DT;
        this.rise = Math.max(0, 1 - this.down / 0.3);
        if (this.down > 0.35) this.remove = true;
      }
    } else if (this.kind === "balloon") {
      this.y += this.vy * DT;
      this.x += Math.sin(this.age * 1.3 + this.spin) * 0.004;
      if (this.y > 6 || this.state !== "up") this.remove = true;
    } else if (this.kind === "bottle") {
      this.vy -= 9.8 * DT;
      this.x += this.vx * DT; this.y += this.vy * DT;
      this.spin += 8 * DT;
      if (this.y < -0.3 || this.state !== "up") this.remove = true;
    } else if (this.kind === "coin") {
      this.y = this.baseY + Math.sin(this.age * 2.5) * 0.06;
      this.spin += 4 * DT;
      if (this.age > this.life || this.state !== "up") this.remove = true;
    }
  }
  intersect(px, py, pz, x, y, z) {
    if (this.state !== "up" || this.rise < 0.7) return null;
    const z0 = this.z;
    if (!(pz - 0.15 < z0 && z >= z0)) return null;
    const t = clamp((z0 - pz) / (z - pz || 1e-6), 0, 1);
    const ix = px + (x - px) * t, iy = py + (y - py) * t;
    const d = Math.hypot(ix - this.x, iy - this.y);
    return d < this.r ? { obj: this, z: z0, lx: ix - this.x, ly: iy - this.y, d } : null;
  }
  onKnife(k, hit) {
    const g = game;
    const c = proj(this.x, this.y, this.z);
    const sx = c.x + hit.lx * c.s, sy = c.y - hit.ly * c.s;
    g.stats.hits++;
    const distMul = 0.6 + this.z / 10;
    if (this.kind === "board") {
      k.stickTo(this, hit.lx, hit.ly);
      this.hits++;
      const d = hit.d / this.r;
      let base, label, col;
      if (d < 0.18) { base = 100; label = "BULLSEYE"; col = "#ffd84d"; g.stats.bulls++; sfx.bullseye(); burst(sx, sy, 16, "#ffd84d", { max: 6 }); }
      else if (d < 0.45) { base = 50; label = null; col = "#ff8a7a"; sfx.thunk(); }
      else if (d < 0.72) { base = 25; label = null; col = "#efe8da"; sfx.thunk(); }
      else { base = 10; label = null; col = "#c9b08a"; sfx.thunk(); }
      g.bumpCombo();
      g.addScore(Math.round(base * distMul), sx, sy - 18, label, col, label ? 22 : 16);
      burst(sx, sy, 5, "#8a6a44", { max: 3, size: 0.8 });
      return true;
    }
    this.state = "hit";
    g.bumpCombo();
    if (this.kind === "balloon") {
      sfx.pop();
      burst(sx, sy, 16, this.color, { max: 7, grav: 0.1 });
      g.addScore(Math.round(40 * distMul), sx, sy - 10, null, this.color, 17);
    } else if (this.kind === "bottle") {
      sfx.shatter();
      burst(sx, sy, 20, "#7fe08a", { max: 8 });
      g.addScore(Math.round(90 * distMul), sx, sy - 10, "SMASH", "#7fe08a", 20);
    } else {
      sfx.coin();
      burst(sx, sy, 18, "#ffd84d", { max: 7, grav: 0.1 });
      g.addScore(Math.round(120 * distMul), sx, sy - 10, "GOLD", "#ffd84d", 22);
    }
    return false;   // knife carries on through
  }
}

// ============ GAME / STATE ============
const game = {
  mode: "fight",
  state: "menu",          // menu | play | paused | over
  t: 0,
  best: { fight: loadBest("kf_best_fight"), range: loadBest("kf_best_range"), duel: loadBest("kf_best_duel") },
  particles: [], popups: [], knives: [], enemies: [], targets: [],
  slots: [null],
  get mult() { return Math.min(5, 1 + Math.floor(this.combo / 4)); },
  get hasKnife() { return this.mode === "range" || this.belt > 0; },

  start(mode) {
    this.mode = mode;
    this.state = "play";
    this.score = 0; this.combo = 0;
    this.hp = MAX_HP; this.iframes = 0; this.hurtFlash = 0; this.shake = 0; this.scratch = null;
    this.beltMax = mode === "fight" ? 8 : mode === "duel" ? 4 : 0;
    this.belt = this.beltMax;
    this.knives = []; this.enemies = []; this.targets = []; this.particles = []; this.popups = [];
    this.slots = [null];
    this.throwCD = 0; this.deflectCD = 0; this.deflectT = 0; this.deflectAt = { x: CX, y: HOR };
    this.charging = false; this.chargeT = 0; this.throwAnim = 0;
    this.banner = null;
    this.wave = 0; this.duelN = 0; this.pace = 1; this.elapsed = 0;
    this.stats = { thrown: 0, hits: 0, heads: 0, deflects: 0, kills: 0, bulls: 0, bestCombo: 0 };
    if (mode === "fight") startWave(1);
    else if (mode === "duel") startThrowdown(1);
    else {
      this.time = RANGE_TIME;
      this.spawnT = 0.3; this.balloonT = 2; this.bottleT = 10; this.coinT = 8;
      showBanner("TARGET RANGE", "60 seconds · unlimited knives · farther throws score more");
      sfx.wave();
    }
  },
  end() {
    this.state = "over"; this.overT = 0; this.charging = false;
    const prev = this.best[this.mode];
    this.newBest = this.score > prev;
    if (this.newBest) { this.best[this.mode] = this.score; saveBest("kf_best_" + this.mode, this.score); }
    persistBests();
    reportProgress();
    if (siteMode()) window.KG.event(this.mode === "range" ? "range_complete" : "run_over", {
      mode: this.mode, score: this.score, wave: this.wave, duelN: this.duelN, newBest: this.newBest,
    });
    if (this.mode === "range") sfx.clear(); else sfx.over();
  },
  addScore(base, x, y, label, color, size) {
    const pts = Math.round(base * this.mult);
    this.score += pts;
    popup(x, y, label ? `${label} +${pts}` : `+${pts}`, color, size);
  },
  bumpCombo() {
    this.combo++;
    this.stats.bestCombo = Math.max(this.stats.bestCombo, this.combo);
  },
  miss() { if (this.combo >= 4) popup(CX, HOR - 60, "COMBO LOST", "rgba(223,230,242,.6)", 14); this.combo = 0; },
  returnKnife() { if (this.mode !== "range" && this.state === "play") this.belt = Math.min(this.beltMax, this.belt + 1); },
  hurt(dmg, dir) {
    if (this.state !== "play" || this.iframes > 0) return;
    this.hp -= dmg;
    this.iframes = 0.6; this.hurtFlash = 0.35; this.shake = 16;
    this.combo = 0;
    this.scratch = { t: 0.7, dir };
    sfx.hurt();
    if (this.hp <= 0) { this.hp = 0; this.end(); }
  },
  claimSlot(e) {
    if (e.z > HOLD_Z + 4) return -1;
    const i = this.slots.indexOf(null);
    if (i >= 0) this.slots[i] = e;
    return i;
  },
  slotX(i) { return this.slots.length === 1 ? 0 : i === 0 ? -0.6 : 0.6; },
};

function showBanner(title, sub, dur = 2.2) { game.banner = { title, sub, t: 0, dur }; }

// ----- Knife Wave -----
function buildWave(n) {
  const total = 4 + n * 2;
  const list = [];
  if (NEW_TYPE[n]) list.push(NEW_TYPE[n], NEW_TYPE[n]);
  let brutes = n >= 5 ? Math.min(3, Math.floor((n - 3) / 2)) : 0;
  while (list.length < total) {
    const k = weighted([
      ["grunt", 5], ["runner", n >= 2 ? 3 : 0], ["thrower", n >= 3 ? 2.2 : 0],
      ["shield", n >= 4 ? 2 : 0], ["brute", brutes > 0 ? 1 : 0],
    ]);
    if (k === "brute") brutes--;
    list.push(k);
  }
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  if (n === 1) list.sort((a, b) => (a === "grunt" ? 0 : 1) - (b === "grunt" ? 0 : 1));
  return list;
}
function startWave(n) {
  const g = game;
  g.wave = n; g.queue = buildWave(n);
  g.wavePhase = "intro"; g.phaseT = 2.4;
  g.pace = Math.max(0.6, 1 - 0.045 * (n - 1));
  g.slots = new Array(n >= 4 ? 2 : 1).fill(null);
  showBanner(`WAVE ${n}`, WAVE_INTRO[n] || "They keep coming — faster now");
  sfx.wave();
}
function spawnEnemy(key) {
  const e = new Enemy(key, rand(-3.2, 3.2), rand(25, 29));
  if (e.t.ranged) e.laneX = rand(-3.5, 3.5);
  game.enemies.push(e);
}
function updateWaves() {
  const g = game;
  if (g.wavePhase === "intro") {
    if ((g.phaseT -= DT) <= 0) { g.wavePhase = "fight"; g.spawnT = 0; }
  } else if (g.wavePhase === "fight") {
    g.spawnT -= DT;
    const alive = g.enemies.filter(e => e.alive).length;
    const maxAlive = 3 + Math.floor(g.wave / 2);
    if (g.queue.length && g.spawnT <= 0 && alive < maxAlive) {
      spawnEnemy(g.queue.shift());
      g.spawnT = Math.max(0.9, 2.6 - 0.15 * g.wave) * rand(0.8, 1.2);
    }
    if (!g.queue.length && !alive) {
      g.wavePhase = "clear"; g.phaseT = 2.4;
      const healed = g.hp < MAX_HP;
      g.hp = Math.min(MAX_HP, g.hp + 1);
      g.score += 250 * g.wave;
      showBanner("WAVE CLEAR", `+${(250 * g.wave).toLocaleString()} bonus${healed ? " · +1 heart" : ""}`);
      sfx.clear();
    }
  } else if ((g.phaseT -= DT) <= 0) startWave(g.wave + 1);
}

// ----- Throwdown (ranged ace duels) -----
function startThrowdown(k) {
  const g = game;
  g.duelN = k; g.wave = k; g.pace = Math.max(0.55, 1 - 0.05 * (k - 1));
  g.slots = [null];
  g.wavePhase = "intro"; g.phaseT = 2.2;
  const [name] = ACES[(k - 1) % ACES.length];
  const tips = [
    "Deflect their knives, then return fire",
    "Hold click for a power throw — it hits harder",
    "Headshots drop them fast",
    "They throw quicker now — stay calm",
    "Lead moving throws. Don't spam.",
  ];
  showBanner(`THROWDOWN ${k} · ${name.toUpperCase()}`, tips[Math.min(k - 1, tips.length - 1)]);
  sfx.wave();
}
function updateThrowdown() {
  const g = game;
  if (g.wavePhase === "intro") {
    if ((g.phaseT -= DT) <= 0) {
      g.wavePhase = "fight";
      const k = g.duelN;

// ============ PLAYER ACTIONS ============
const chargeFrac = () => clamp((game.chargeT - KNIFE.chargeDelay) / KNIFE.chargeTime, 0, 1);

function tryThrow() {
  const g = game;

  if (!g.hasKnife) { sfx.empty(); popup(mouse.x, mouse.y - 24, "NO KNIVES", "rgba(255,93,93,.85)", 14); return; }
  const frac = chargeFrac(), power = frac >= 1;
  const speed = lerp(KNIFE.speed, KNIFE.powerSpeed, frac);
  let dx = (mouse.x - CX) / F, dy = -(mouse.y - HOR) / F, dz = 1;
  const len = Math.hypot(dx, dy, dz); dx /= len; dy /= len; dz /= len;
  g.knives.push(new Knife({
    x: dx * 0.25, y: EYE + dy * 0.25, z: dz * 0.25,
    vx: dx * speed, vy: dy * speed, vz: dz * speed,
    owner: "player", mine: g.mode !== "range", power,

function tryDeflect() {

    const p = proj(k.x, k.y, k.z);

}

function deflect(k, p) {
  const g = game;
  k.owner = "player"; k.deflected = true; k.mine = false; k.from = null;
  const src = k.src && k.src.alive ? k.src : null;
  const tx = src ? src.x : k.x * 0.5, ty = src ? 1.64 * src.sc : 1.5, tz = src ? src.z : 25;
  const speed = 30;

// ============ UPDATE ============
function updateWorld() {
  const g = game;
  g.elapsed += DT;
  g.iframes = Math.max(0, g.iframes - DT);

  if (g.banner && (g.banner.t += DT) > g.banner.dur) g.banner = null;

  for (const e of g.enemies) e.update();
  separateEnemies();
  for (const e of g.enemies) if (e.remove) releaseKnives(e);
  g.enemies = g.enemies.filter(e => !e.remove);

  for (const t of g.targets) t.update();

  for (const k of g.knives) k.update();

}

function separateEnemies() {

  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {

const MENU_CARDS = [

  { mode: "range", key: "2", title: "TARGET RANGE", lines: ["60 seconds, unlimited knives.", "Boards, balloons, bottles, gold."] },

function tick() {
  const g = game;
  g.t += DT;
  if (pressed.KeyM) sfx.toggle();
  if (g.state !== "paused") updateEffects();

  if (g.state === "menu") {
    menuDummy.walk += DT * 1.5; menuDummy.age += DT;
    const keyCard = MENU_CARDS.find(c => pressed["Digit" + c.key] || pressed["Numpad" + c.key]);
    if (keyCard) g.start(keyCard.mode);
    else if (mouse.pressed) {
      if (siteMode() && inRect(mouse.x, mouse.y, HOME_BTN)) { window.KG.home(); mouse.down = false; }
      else {
        const card = MENU_CARDS.find(c => inRect(mouse.x, mouse.y, c));
        if (card) { g.start(card.mode); mouse.down = false; }
      }
    }
    clearInput(); return;
  }
  if (g.state === "over") {
    g.overT += DT;
    if (pressed.Escape) g.state = "menu";
    else if (g.overT > 0.7 && (pressed.Enter || pressed.Space || pressed.KeyR || mouse.pressed)) { g.start(g.mode); mouse.down = false; }
    clearInput(); return;
  }
  if (g.state === "paused") {
    if (pressed.KeyP || mouse.pressed) g.state = "play";
    else if (pressed.Escape) g.state = "menu";
    else if (pressed.KeyR) g.start(g.mode);
    mouse.down = false; g.charging = false;
    clearInput(); return;
  }
  if (pressed.KeyP || pressed.Escape) { g.state = "paused"; clearInput(); return; }
  if (pressed.KeyR) { g.start(g.mode); clearInput(); return; }
  playerInput();
  updateWorld();
  siteStatus();
  clearInput();
}

let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= DT) { tick(); acc -= DT; }
  render();
  requestAnimationFrame(loop);
}

  const r = canvas.getBoundingClientRect();

  canvas.width = Math.round(r.width * dpr);

    }
  }

  ctx.strokeStyle = col(shade(base, -0.25)); ctx.lineWidth = 0.1;
  const elbow = { x: lerp(0.24, hand.x, 0.5) + 0.08, y: lerp(sh, hand.y, 0.5) - 0.04 };
  ctx.beginPath(); ctx.moveTo(0.24, sh); ctx.quadraticCurveTo(elbow.x, elbow.y, hand.x, hand.y); ctx.stroke();
  let ka = 1.2;
  if (e.phase === "windup") ka = e.dir === "L" ? 2.3 : e.dir === "R" ? 0.85 : 1.75;
  else if (e.phase === "strike") ka = 1.9;
  const big = e.phase === "strike" ? 1.6 : 1;
  ctx.save();
  ctx.translate(hand.x, hand.y); ctx.rotate(ka); ctx.scale(big, big);
  if (e.phase === "windup" && !fl) { ctx.shadowColor = e.t.ranged ? "#ffb04d" : "#ff3b4a"; ctx.shadowBlur = 18; }
  ctx.fillStyle = "#e6ebf3";
  ctx.beginPath(); ctx.moveTo(0.02, -0.025); ctx.lineTo(0.22, -0.02); ctx.lineTo(0.3, 0); ctx.lineTo(0.22, 0.018); ctx.lineTo(0.02, 0.02); ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#3a2a20"; ctx.fillRect(-0.1, -0.018, 0.1, 0.036);
  ctx.restore();
  ctx.fillStyle = col("#c99a74");
  ctx.beginPath(); ctx.arc(hand.x, hand.y, 0.045, 0, TAU); ctx.fill();
  ctx.fillStyle = col("#c99a74");
  ctx.beginPath(); ctx.arc(offHand.x, offHand.y, 0.045, 0, TAU); ctx.fill();
  ctx.restore();

  // knives stuck in them
  for (const k of game.knives) {
    if (k.host !== e || k.state !== "stuck") continue;
    const q = e.toScreen(k.lx, k.ly, v);
    ctx.save(); ctx.globalAlpha = alpha;

  if (e.maxHp > 1 && (e.hp < e.maxHp || e.engaged)) {
    const top = e.toScreen(0, 1.86, v);
    const pw = Math.max(4, Math.min(12, 0.08 * S)), gap = 2, tw = e.maxHp * pw + (e.maxHp - 1) * gap;

  }
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function drawTarget(t) {
  const c = proj(t.x, t.y, t.z), s = c.s;
  if (t.kind === "board") {
    const g = proj(t.x, 0, t.z);
    const cy = lerp(g.y, c.y, t.rise), sy = t.rise;
    ctx.fillStyle = "#3a2a1c"; ctx.fillRect(c.x - 0.04 * s, cy, 0.08 * s, g.y - cy);
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(c.x, g.y, 0.3 * s, 0.05 * s, 0, 0, TAU); ctx.fill();
    for (const [rr, col] of [[1.08, "#5a3e24"], [1, "#efe8da"], [0.72, "#d8433a"], [0.45, "#efe8da"], [0.18, "#ffcf3f"]]) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(c.x, cy, rr * t.r * s, rr * t.r * s * sy, 0, 0, TAU); ctx.fill();
    }
    for (const k of game.knives) {
      if (k.host !== t || k.state !== "stuck") continue;

    }

    ctx.strokeStyle = "rgba(230,230,230,.4)"; ctx.lineWidth = 1;
    line(c.x, c.y + t.r * s, c.x + Math.sin(t.age * 2) * 0.05 * s, c.y + t.r * s + 0.5 * s);
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, t.r * s * 0.9, t.r * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(c.x - t.r * s * 0.3, c.y - t.r * s * 0.35, t.r * s * 0.18, t.r * s * 0.28, -0.4, 0, TAU); ctx.fill();
  } else if (t.kind === "bottle") {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(t.spin); ctx.scale(s, s);
    ctx.fillStyle = "#3f8f4c"; rrect(ctx, -0.06, -0.08, 0.12, 0.2, 0.03); ctx.fill();
    ctx.fillRect(-0.025, -0.17, 0.05, 0.1);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(-0.04, -0.05, 0.02, 0.13);
    ctx.restore();
  } else {
    const w = Math.abs(Math.cos(t.spin));
    ctx.fillStyle = "#ffd84d"; ctx.shadowColor = "#ffd84d"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.max(1, t.r * s * w), t.r * s, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#c9a227";
    ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.max(0.5, t.r * s * w * 0.6), t.r * s * 0.6, 0, 0, TAU); ctx.fill();
  }
}

function drawWorld(menu = false) {
  drawSky(); drawGround(); drawFence();
  const list = [];
  for (const p of POSTS) list.push({ z: p.z, f: () => drawPost(p) });
  if (menu) {
    list.push({ z: menuDummy.z, f: () => drawEnemy(menuDummy) });
    list.push({ z: MENU_BOARD.z, f: () => drawTarget(MENU_BOARD) });
  } else {
    for (const e of game.enemies) list.push({ z: e.z, f: () => drawEnemy(e) });
    for (const t of game.targets) list.push({ z: t.z, f: () => drawTarget(t) });
    for (const k of game.knives) {
      if (k.state === "stuck" && k.host.kind !== "ground" && k.host.kind !== "wall") continue;
      list.push({ z: k.z, f: () => k.draw() });
    }
  }
  list.sort((a, b) => b.z - a.z);
  for (const d of list) d.f();
  // vignette
  const v = ctx.createRadialGradient(CX, H * 0.55, H * 0.35, CX, H * 0.55, W * 0.7);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ----- your hand -----
function deflectPoint(u) {
  const a = game.deflectAt;
  const P0 = { x: a.x + 260, y: a.y - 170 }, P2 = { x: a.x - 240, y: a.y + 190 };
  const C = { x: 2 * a.x - (P0.x + P2.x) / 2, y: 2 * a.y - (P0.y + P2.y) / 2 };
  const m = 1 - u;
  return {
    x: m * m * P0.x + 2 * m * u * C.x + u * u * P2.x,
    y: m * m * P0.y + 2 * m * u * C.y + u * u * P2.y,
  };
}
function drawViewmodel(idle = false) {
  const g = game;
  const breathe = Math.sin(g.t * 2) * 3;
  let hx = HAND_REST.x, hy = HAND_REST.y + breathe, ang = -1.3;
  let showKnife = idle || g.hasKnife;
  if (!idle) {
    const cf = chargeFrac();
    if (g.charging && mouse.down) {
      hx += 40 * cf + rand(-1, 1) * cf * 1.5; hy -= 46 * cf;
      ang = lerp(-1.3, -0.5, cf);
    }
    if (g.throwAnim > 0) {
      const u = 1 - g.throwAnim / 0.16, k = Math.sin(u * Math.PI);
      hx = lerp(hx, lerp(HAND_REST.x, mouse.x, 0.3), k);
      hy = lerp(hy, lerp(HAND_REST.y, mouse.y, 0.3), k);
      ang = -1.3 - k * 0.5;
      showKnife = showKnife && u > 0.9;
    }
    if (g.deflectT > 0) {
      const u0 = 1 - g.deflectT / DEFLECT.time, u = 1 - (1 - u0) * (1 - u0);
      const P = deflectPoint(u), Q = deflectPoint(Math.min(1, u + 0.02));
      hx = P.x + 20; hy = P.y + 30;
      ang = Math.atan2(Q.y - P.y, Q.x - P.x) - 0.6;
      ctx.save();
      ctx.lineCap = "round";
      const from = Math.max(0, u - 0.5);
      for (const [w, c] of [[16, "rgba(160,200,255,.22)"], [7, "rgba(235,245,255,.6)"], [2.5, "#ffffff"]]) {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath();
        for (let i = 0; i <= 16; i++) { const q = deflectPoint(lerp(from, u, i / 16)); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  // arm
  ctx.save();
  ctx.lineCap = "round";
  const ax = W + 70, ay = H + 110;
  ctx.strokeStyle = "#241a15"; ctx.lineWidth = 62; line(ax, ay, hx + 14, hy + 26);
  ctx.strokeStyle = "#3b2c22"; ctx.lineWidth = 52; line(ax, ay, hx + 14, hy + 26);
  ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 10; line(ax - 14, ay - 18, hx + 4, hy + 14);
  ctx.strokeStyle = "#1a120e"; ctx.lineWidth = 46; line(hx + 22, hy + 38, hx + 12, hy + 22);
  if (showKnife) drawKnife(ctx, hx + Math.cos(ang) * 30, hy + Math.sin(ang) * 30, ang, { scale: 3.4 });
  ctx.fillStyle = "#c98f66";
  ctx.beginPath(); ctx.ellipse(hx, hy, 24, 20, ang + 0.4, 0, TAU); ctx.fill();
  ctx.fillStyle = "#b07a55";
  ctx.beginPath(); ctx.ellipse(hx - 6, hy + 4, 14, 10, ang + 0.4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHUD() {

    if (g.wavePhase === "fight") text(`${left} LEFT`, CX, 52, { size: 11, weight: 700, align: "center", color: "rgba(223,230,242,.55)", spacing: 2 });

    const p = proj(k.x, k.y, k.z);

    ctx.strokeStyle = `rgba(255,40,60,${a})`; ctx.lineWidth = 20; ctx.strokeRect(0, 0, W, H);
  }
}
function drawEffects() {

function drawCrosshair() {

    text(String(v), x + 160, y, { size: 14, weight: 800, align: "right" });
  });
  if (g.overT > 0.7) text("Click or press Enter to play again  ·  Esc for menu", CX, py + ph - 22, { size: 13, align: "center", color: "rgba(223,230,242,.6)" });
}

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (game.state === "menu") {
    drawMenu();
    drawViewmodel(true);
    drawCrosshair();
    return;
  }
  ctx.save();
  if (game.shake > 0.3) ctx.translate(rand(-0.5, 0.5) * game.shake, rand(-0.5, 0.5) * game.shake);
  drawWorld();
  drawEffects();
  drawViewmodel();
  ctx.restore();
  if (game.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,30,50,${game.hurtFlash / 0.35 * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawScratch();
  drawHUD();
  drawBanner();
  if (game.state === "paused") drawPause();
  if (game.state === "over") drawOver();
  drawCrosshair();
}

mergeCloudBests();
if (siteMode()) {
  reportProgress();
  window.KG.setStatus("Menu");
}
fit();
addEventListener("resize", fit);
requestAnimationFrame(loop);
</script>
</body>
</html>
