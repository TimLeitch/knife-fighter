<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setup · Kaotic Gaming</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
  main { display: grid; place-items: start center; padding-block: 48px; }
  .box { width: 100%; max-width: 460px; padding: 24px; display: grid; gap: 16px; }
  form { display: grid; gap: 14px; }
  .btn { width: 100%; }
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="logo" href="/"><b>Kaotic</b> Gaming</a></div></header>
<main class="wrap">
  <div class="box panel">
    <div class="eyebrow">First-time setup</div>
    <h1>Create your admin account</h1>
    <p class="muted" style="margin:0">This account can see every player and game on the admin page. This page only works on the computer running the site, and only until an admin exists.</p>
    <form id="form" novalidate>
      <div><label for="username">Admin username</label><input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></div>
      <div><label for="password">Password (at least 8 characters)</label><input type="password" id="password" autocomplete="new-password" maxlength="128"></div>
      <div><label for="confirm">Password again</label><input type="password" id="confirm" autocomplete="new-password" maxlength="128"></div>
      <div class="msg" id="msg" role="status"></div>
      <button class="btn" id="submit" type="submit">Create admin account</button>
    </form>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
$('#form').onsubmit = async e => {
  e.preventDefault();
  const msg = $('#msg'); msg.className = 'msg err';
  if ($('#password').value !== $('#confirm').value) { msg.textContent = "The two passwords don't match."; return; }
  $('#submit').disabled = true;
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-KG': '1' }, body: JSON.stringify({ username: $('#username').value.trim(), password: $('#password').value }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || 'Something went wrong.');
    location.href = '/admin';
  } catch (err) { msg.textContent = err.message; $('#submit').disabled = false; }
};
</script>
</body>
</html>
