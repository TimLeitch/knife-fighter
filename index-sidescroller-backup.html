<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knife Thrower</title>
<style>
  :root {
    --bg1: #10131a; --bg2: #1a2030; --accent: #ff5d5d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% 120%, var(--bg2), var(--bg1));
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    font-family: "Segoe UI", system-ui, sans-serif; color: #dfe6f2;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  canvas {
    display: block; border-radius: 10px;
    width: min(calc(100vw - 32px), calc((100vh - 72px) * 16 / 9));
    height: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    background: linear-gradient(#151a26 0%, #1d2434 70%, #242e44 100%);
    cursor: none; touch-action: none;
  }
  #controls {
    font-size: 12px; opacity: .55; letter-spacing: 1px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding: 0 16px;
  }
  kbd {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    border-radius: 4px; padding: 1px 6px; font-family: inherit; margin: 0 1px;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
  <span><kbd>Mouse</kbd> aim</span>
  <span><kbd>Click</kbd> throw (hold = power)</span>
  <span><kbd>A</kbd><kbd>D</kbd> move</span>
  <span><kbd>W</kbd>/<kbd>Space</kbd> jump</span>
  <span><kbd>S</kbd> drop</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>M</kbd> mute</span>
</div>

<script>
"use strict";
// ============ CONSTANTS ============
const W = 960, H = 540;
const GROUND_Y = 470;
const GRAVITY = 0.9;
const MOVE_SPEED = 4.2;
const JUMP_VEL = -15;
const FIGHTER_W = 30, FIGHTER_H = 96;
const RAIL_Y = 58;
const FONT = "'Segoe UI', system-ui, sans-serif";

const KNIFE = {
  gravity: 0.2,       // thrown knives fall slower than bodies so arcs stay readable
  looseGravity: 0.45, // dropped / bounced knives
  probe: 12,          // collision point, ahead of the knife's center along its flight
};
const THROW = {
  minSpeed: 17, maxSpeed: 26,
  chargeDelay: 6,     // frames held before power starts building
  chargeFrames: 24,   // frames from there to a full power throw
  cooldown: 8,
};
const CLASH_RADIUS = 24;      // knives meeting mid-air knock each other down
const BELT_MAX = 8, BELT_START = 6;
const MAX_HP = 5;
const POWER_THROWS = 8;
const RANGE_TIME = 60 * 60;   // one minute at 60 ticks/s
const RANGE_ZONE = 222;       // throw line in target range mode

// Ground runs past both edges so attackers can walk in from off-screen.
const PLATFORMS = [
  { x: -200, y: GROUND_Y, w: W + 400, h: H - GROUND_Y, ground: true },
  { x: 150,  y: 330,      w: 220,     h: 12,           ground: false },
  { x: 590,  y: 330,      w: 220,     h: 12,           ground: false },
];

const ENEMY_TYPES = {
  runner:   { hp: 1, speed: 1.9,  scale: 1.0,  color: "#ff9d5c", score: 100, windup: 18, dmg: 1 },
  sprinter: { hp: 1, speed: 3.3,  scale: 0.86, color: "#ff5d6c", score: 150, windup: 12, dmg: 1 },
  shield:   { hp: 2, speed: 1.4,  scale: 1.0,  color: "#a9b8d0", score: 250, windup: 20, dmg: 1, shield: true },
  thrower:  { hp: 2, speed: 1.6,  scale: 1.0,  color: "#7fe08a", score: 250, windup: 18, dmg: 1, ranged: true },
  brute:    { hp: 4, speed: 1.15, scale: 1.28, color: "#c08cff", score: 400, windup: 26, dmg: 2, fists: true },
};
const WAVE_INTRO = {
  1: "Runners — click to throw, hold for a power throw",
  2: "Sprinters — lead your throws",
  3: "Shield bearers — aim for the head, or power-throw to smash the shield",
  4: "Knife throwers — hit their knives out of the air",
  5: "Brutes — tough, but a headshot still drops them",
};
const NEW_TYPE = { 2: "sprinter", 3: "shield", 4: "thrower", 5: "brute" };

const PICKUPS = {
  heart:  { col: "#ff5d6c", label: "+1 HEART" },
  triple: { col: "#ffd84d", label: "TRIPLE THROW" },
  pierce: { col: "#6fd3ff", label: "PIERCING KNIVES" },
  knives: { col: "#dfe6f2", label: "+3 KNIVES" },
};
const BALLOON_COLORS = ["#ff5d6c", "#ffd84d", "#6fd3ff", "#7fe08a", "#c08cff", "#ff9d5c"];

// ============ HELPERS ============
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weighted(table) {          // [[item, weight], ...]
  let sum = 0;
  for (const [, w] of table) sum += w;
  let r = Math.random() * sum;
  for (const [item, w] of table) if ((r -= w) <= 0 && w > 0) return item;
  return table[0][0];
}
function inRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}
function loadBest(key) {
  try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
}
function saveBest(key, v) {
  try { localStorage.setItem(key, String(v)); } catch (e) { /* storage unavailable */ }
}

// ============ INPUT ============
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const keys = {}, pressed = {};
const mouse = { x: W * 0.75, y: GROUND_Y - 80, down: false, pressed: false, released: false };

addEventListener("keydown", e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  if (game.state === "play") game.state = "paused";
});

function trackPointer(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
addEventListener("pointermove", trackPointer);
canvas.addEventListener("pointerdown", e => {
  trackPointer(e);
  sfx.ensure();
  if (e.button === 0) { mouse.down = true; mouse.pressed = true; }
  e.preventDefault();
});
addEventListener("pointerup", e => {
  if (e.button === 0 && mouse.down) { mouse.down = false; mouse.released = true; }
});
canvas.addEventListener("contextmenu", e => e.preventDefault());

function clearInput() {
  for (const k in pressed) delete pressed[k];
  mouse.pressed = mouse.released = false;
}

// ============ AUDIO (synthesized, no assets) ============
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.45;
        master.connect(ac.destination);
      } catch (e) { ac = null; return; }
    }
    if (ac.state === "suspended") ac.resume();
  }
  function tone(freq, dur, { type = "sine", vol = 0.2, slide = 0, delay = 0 } = {}) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, { vol = 0.2, freq = 1000, q = 1, filter = "bandpass", slide = 0, delay = 0 } = {}) {
    if (!ac || muted) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = filter; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (slide) f.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.03);
  }
  const notes = (list, o) => list.forEach((f, i) => tone(f, o.dur, { ...o, delay: i * o.step }));
  return {
    ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; },
    whoosh(power) {
      noise(power ? 0.2 : 0.14, { vol: 0.2, freq: 700, slide: power ? 4200 : 3000, q: 1.4 });
      if (power) tone(160, 0.18, { type: "sawtooth", vol: 0.05, slide: 420 });
    },
    thunk() { tone(170, 0.09, { type: "triangle", vol: 0.32, slide: 70 }); noise(0.05, { vol: 0.2, freq: 700, filter: "lowpass" }); },
    dirt() { noise(0.07, { vol: 0.16, freq: 450, filter: "lowpass" }); tone(110, 0.06, { vol: 0.14, slide: 60 }); },
    clank() {
      tone(1250, 0.16, { type: "square", vol: 0.05, slide: 1050 });
      tone(1900, 0.13, { type: "triangle", vol: 0.08 });
      noise(0.04, { vol: 0.14, freq: 5000, filter: "highpass" });
    },
    hit() { noise(0.09, { vol: 0.3, freq: 520, filter: "lowpass" }); tone(210, 0.08, { type: "square", vol: 0.07, slide: 90 }); },
    headshot() { this.hit(); tone(900, 0.14, { vol: 0.14, slide: 1600, delay: 0.03 }); },
    pop() { noise(0.07, { vol: 0.35, freq: 2200, q: 0.7 }); tone(520, 0.05, { vol: 0.14, slide: 160 }); },
    crack() { noise(0.16, { vol: 0.3, freq: 900, q: 0.8 }); tone(140, 0.12, { type: "triangle", vol: 0.2, slide: 60 }); },
    pickup() { tone(880, 0.06, { vol: 0.1 }); tone(1320, 0.08, { vol: 0.1, delay: 0.05 }); },
    power() { notes([660, 880, 1100, 1320], { type: "triangle", vol: 0.1, dur: 0.09, step: 0.05 }); },
    bullseye() { tone(1047, 0.14, { type: "triangle", vol: 0.14 }); tone(1568, 0.22, { type: "triangle", vol: 0.12, delay: 0.07 }); },
    hurt() { tone(240, 0.28, { type: "sawtooth", vol: 0.14, slide: 80 }); noise(0.12, { vol: 0.2, freq: 300, filter: "lowpass" }); },
    ouch() { tone(520, 0.22, { type: "triangle", vol: 0.14, slide: 260 }); },
    empty() { tone(320, 0.05, { type: "square", vol: 0.05 }); tone(240, 0.05, { type: "square", vol: 0.05, delay: 0.06 }); },
    tick() { tone(1400 + Math.random() * 400, 0.03, { vol: 0.05 }); },
    wave() { notes([523, 659, 784], { type: "triangle", vol: 0.1, dur: 0.12, step: 0.09 }); },
    clear() { notes([523, 659, 784, 1047], { type: "triangle", vol: 0.11, dur: 0.14, step: 0.08 }); },
    over() { notes([392, 330, 262, 196], { type: "triangle", vol: 0.12, dur: 0.22, step: 0.16 }); },
  };
})();

// ============ SHARED PHYSICS ============
// Gravity, integration and landing on platforms (from above only). Used by the player and attackers.
function bodyPhysics(f, friction) {
  f.vy += GRAVITY;
  f.x += f.vx;
  f.y += f.vy;
  f.vx *= friction;
  if (f.dropT > 0) f.dropT--;
  f.onGround = false;
  for (const p of PLATFORMS) {
    if (f.dropT > 0 && !p.ground) continue;
    if (f.vy >= 0 && f.bottom > p.y && f.bottom < p.y + 26 &&
        f.x + f.w > p.x + 4 && f.x < p.x + p.w - 4) {
      f.y = p.y - f.h; f.vy = 0; f.onGround = true; f.jumpsLeft = 2;
    }
  }
  if (f.bottom > GROUND_Y) { f.y = GROUND_Y - f.h; f.vy = 0; f.onGround = true; f.jumpsLeft = 2; }
}

// ============ PLAYER ============
class Player {
  constructor() {
    this.w = FIGHTER_W; this.h = FIGHTER_H;
    this.reset(W / 2);
  }
  reset(x) {
    this.x = x; this.y = GROUND_Y - this.h;
    this.vx = 0; this.vy = 0;
    this.onGround = true; this.jumpsLeft = 2; this.dropT = 0;
    this.hp = MAX_HP; this.inv = 0; this.hurtT = 0;
    this.dead = false; this.deadT = 0;
    this.facing = 1; this.animT = 0;
    this.belt = BELT_START;
    this.charging = false; this.chargeT = 0; this.queued = null;
    this.throwAnim = 0; this.throwCd = 0;
    this.power = null;            // { type: "triple" | "pierce", n: throws left }
  }
  get cx() { return this.x + this.w / 2; }
  get bottom() { return this.y + this.h; }
  get shoulder() { return { x: this.cx, y: this.y + 34 }; }
  get charge() { return clamp((this.chargeT - THROW.chargeDelay) / THROW.chargeFrames, 0, 1); }
  get hasKnives() { return game.mode === "range" || this.belt > 0; }
  aimAngle() {
    const s = this.shoulder, dx = mouse.x - s.x, dy = mouse.y - s.y;
    if (Math.hypot(dx, dy) < 8) return this.facing > 0 ? 0 : Math.PI;
    return Math.atan2(dy, dx);
  }
  throwSpeed(charge) { return lerp(THROW.minSpeed, THROW.maxSpeed, charge); }

  update() {
    this.animT++;
    if (this.inv > 0) this.inv--;
    if (this.hurtT > 0) this.hurtT--;
    if (this.throwAnim > 0) this.throwAnim--;
    if (this.throwCd > 0) this.throwCd--;
    if (this.dead) {
      this.deadT++;
      bodyPhysics(this, this.onGround ? 0.85 : 0.97);
      this.clampX();
      return;
    }

    const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
    const speed = MOVE_SPEED * (this.charging ? 0.6 : 1);
    if (this.hurtT <= 0) {
      if (left && !right) this.vx = -speed;
      else if (right && !left) this.vx = speed;
    }
    if ((pressed.KeyW || pressed.Space || pressed.ArrowUp) && this.jumpsLeft > 0) {
      this.vy = JUMP_VEL; this.jumpsLeft--; this.onGround = false;
    }
    if ((pressed.KeyS || pressed.ArrowDown) && this.onGround && this.bottom < GROUND_Y - 1) this.dropT = 14;

    this.facing = mouse.x >= this.cx ? 1 : -1;

    // Throw: press to wind up, release to let go. Holding longer throws harder and flatter.
    if (mouse.pressed && game.canThrow) { this.charging = true; this.chargeT = 0; }
    if (this.charging) {
      this.chargeT++;
      if (!mouse.down) { this.charging = false; this.queued = this.charge; }
    }
    if (this.queued !== null && this.throwCd <= 0) {
      this.throwKnife(this.queued);
      this.queued = null;
    }

    bodyPhysics(this, this.onGround ? 0.8 : 0.96);
    this.clampX();
  }

  clampX() {
    const maxX = game.mode === "range" ? RANGE_ZONE - this.w : W - this.w;
    if (this.x < 0) { this.x = 0; this.vx = Math.max(0, this.vx); }
    if (this.x > maxX) { this.x = maxX; this.vx = Math.min(0, this.vx); }
  }

  throwKnife(charge) {
    if (!this.hasKnives) {
      sfx.empty();
      game.float(this.cx, this.y - 18, "NO KNIVES", "#ff7b7b", 15);
      return;
    }
    const base = this.aimAngle(), s = this.shoulder;
    const speed = this.throwSpeed(charge), power = charge >= 1;
    const pierce = !!this.power && this.power.type === "pierce";
    const spread = this.power && this.power.type === "triple" ? [-0.11, 0, 0.11] : [0];
    for (const off of spread) {
      const a = base + off;
      game.knives.push(new Knife(s.x + Math.cos(a) * 22, s.y + Math.sin(a) * 22,
        Math.cos(a) * speed, Math.sin(a) * speed, "player",
        { power, dmg: power ? 2 : 1, pierce, phantom: off !== 0, counted: off === 0 }));
    }
    if (game.mode === "survival") this.belt--;
    if (this.power && --this.power.n <= 0) this.power = null;
    this.throwAnim = 10;
    this.throwCd = THROW.cooldown;
    game.stats.throws++;
    sfx.whoosh(power);
  }

  hurt(dmg, fromX) {
    if (this.inv > 0 || this.dead) return false;
    this.hp = Math.max(0, this.hp - dmg);
    const dir = this.cx < fromX ? -1 : 1;
    this.vx = dir * 7; this.vy = -5; this.onGround = false;
    this.inv = 70; this.hurtT = 14;
    this.charging = false; this.queued = null;
    game.hurtFlash = 18;
    game.shake = Math.max(game.shake, 9);
    game.comboBreak();
    sfx.hurt();
    burst(this.cx, this.y + 40, 14, "#6fb6ff");
    if (this.hp <= 0) {
      this.dead = true; this.deadT = 0; this.vy = -8;
      game.playerDied();
    }
    return true;
  }

  draw(ctx) {
    const f = this.facing, A = a => (f > 0 ? a : Math.PI - a);
    const aim = this.aimAngle();
    const moving = Math.abs(this.vx) > 0.5 && this.onGround;
    const sw = moving ? Math.sin(this.animT * 0.3) : 0;
    let rot = moving ? f * 0.08 : 0, armF = A(0.9 - sw * 0.4), armB = A(2.15 + sw * 0.4);
    let knife = A(-0.35), glow = null;
    if (this.dead) { rot = -f * Math.min(1, this.deadT / 16) * 1.45; armF = A(-1.0); armB = A(-2.0); }
    else if (this.hurtT > 0) { rot = -f * 0.22; armF = A(-1.1); armB = A(-2.0); }
    else if (this.charging) {
      const c = this.charge;
      armF = aim - f * (1.7 + 0.8 * c); knife = armF; armB = aim;
      if (c >= 1) glow = "#ff9d5c";
    } else if (this.throwAnim > 0) {
      armF = aim + f * (0.05 + (1 - this.throwAnim / 10) * 0.7); knife = armF; armB = A(2.0);
    }
    const showKnife = this.hasKnives && !(this.throwAnim > 4 && !this.charging);
    const blink = this.inv > 0 && !this.dead && Math.floor(this.inv / 4) % 2;
    drawFigure(ctx, {
      cx: this.cx, bottom: this.bottom, facing: f, rot, color: "#6fb6ff",
      moving, onGround: this.onGround || this.dead, run: this.animT * 0.3,
      armF, armB, knife: showKnife ? knife : null, knifeGlow: glow,
      alpha: blink ? 0.35 : 1,
    });

    // Charge meter over the head
    if (this.charging && this.chargeT > THROW.chargeDelay) {
      const c = this.charge, x = this.cx, y = this.y - 16;
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,.15)";
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = c >= 1 ? (Math.floor(this.chargeT / 4) % 2 ? "#ff9d5c" : "#ffd84d") : "#ffffff";
      ctx.beginPath(); ctx.arc(x, y, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * c); ctx.stroke();
    }
  }
}

// ============ ATTACKERS ============
class Enemy {
  constructor(type, side, speedMul) {
    const T = ENEMY_TYPES[type];
    this.type = type; this.T = T; this.s = T.scale;
    this.w = FIGHTER_W * this.s; this.h = FIGHTER_H * this.s;
    this.x = side > 0 ? W + 30 : -30 - this.w;
    this.y = GROUND_Y - this.h;
    this.vx = 0; this.vy = 0; this.onGround = true; this.dropT = 0;
    this.hp = T.hp;
    this.speed = T.speed * speedMul * rand(0.9, 1.1);
    this.facing = -side; this.entered = false;
    this.attack = null;           // { phase: windup | active | recovery, t, hit }
    this.stun = 0; this.flash = 0; this.animT = rand(0, 100);
    this.dead = false; this.deadT = 0;
    this.shieldUp = !!T.shield;
    this.aimT = 0; this.throwCd = rand(50, 110); this.throwAnim = 0; this.jumpCd = 0;
  }
  get cx() { return this.x + this.w / 2; }
  get bottom() { return this.y + this.h; }
  // Body lean, rotating around the feet. Shared by drawing and the headshot test.
  rot() {
    const f = this.facing;
    if (this.dead) return -f * Math.min(1, this.deadT / 16) * 1.45;
    if (this.stun > 0) return -f * 0.22;
    if (this.attack) return this.attack.phase === "windup" ? -f * 0.08 : this.attack.phase === "active" ? f * 0.22 : f * 0.05;
    if (Math.abs(this.vx) > 0.4 && this.onGround) return f * 0.12;
    return 0;
  }
  get head() {
    const r = this.rot(), d = 79 * this.s;
    return { x: this.cx + Math.sin(r) * d, y: this.bottom - Math.cos(r) * d, r: 13 * this.s };
  }
  shieldRect() {
    if (!this.shieldUp || this.dead) return null;
    const s = this.s;
    return { x: this.facing > 0 ? this.cx + 8 * s : this.cx - 18 * s, y: this.y + 24 * s, w: 10 * s, h: 62 * s };
  }
  hitTest(px, py) {
    if (this.dead) return null;
    const sh = this.shieldRect();
    if (sh && inRect(px, py, sh)) return "shield";
    const hd = this.head;
    if (Math.hypot(px - hd.x, py - hd.y) < hd.r + 4) return "head";
    if (px > this.x - 3 && px < this.x + this.w + 3 && py > this.y + 28 * this.s && py < this.bottom) return "body";
    return null;
  }

  update(p) {
    this.animT++;
    if (this.flash > 0) this.flash--;
    if (this.throwAnim > 0) this.throwAnim--;
    if (this.dead) {
      this.deadT++;
      bodyPhysics(this, this.onGround ? 0.85 : 0.98);
      return;
    }
    const dx = p.cx - this.cx, dist = Math.abs(dx), dir = dx >= 0 ? 1 : -1;
    const sameLevel = Math.abs(p.bottom - this.bottom) < 50;
    if (this.jumpCd > 0) this.jumpCd--;

    if (this.stun > 0) this.stun--;
    else if (this.attack) this.updateAttack(p, dx, sameLevel);
    else if (this.aimT > 0) {
      this.vx = 0; this.facing = dir;
      if (--this.aimT === 0) this.throwAt(p);
    } else {
      this.facing = dir;
      if (p.dead) this.vx = 0;
      else if (dist < 34 * this.s + 12 && sameLevel) this.startAttack();
      else if (this.T.ranged && this.entered && dist > 150) this.rangedMove(dist, dir);
      else this.vx = dir * this.speed;
      // Follow the player between the ground and the ledges.
      if (!p.dead && this.onGround) {
        if (p.bottom < this.bottom - 50 && dist < 170 && p.onGround && this.jumpCd <= 0) {
          this.vy = -17.5; this.vx = dir * Math.max(this.speed, 2.4); this.onGround = false; this.jumpCd = 80;
        } else if (p.bottom > this.bottom + 50 && dist < 70 && this.bottom < GROUND_Y - 1) {
          this.dropT = 14;
        }
      }
    }
    bodyPhysics(this, this.stun > 0 ? 0.88 : (this.onGround ? 0.8 : 0.97));
    if (!this.entered && this.x >= 0 && this.x <= W - this.w) this.entered = true;
    if (this.entered) this.x = clamp(this.x, 0, W - this.w);
  }

  startAttack() {
    this.attack = { phase: "windup", t: this.T.windup, hit: false };
    this.vx = 0;
  }
  updateAttack(p, dx, sameLevel) {
    const a = this.attack;
    this.vx *= 0.5;
    if (--a.t <= 0) {
      if (a.phase === "windup") { a.phase = "active"; a.t = 6; this.vx = this.facing * 3; }
      else if (a.phase === "active") { a.phase = "recovery"; a.t = 22; }
      else { this.attack = null; return; }
    }
    if (a.phase === "active" && !a.hit) {
      const reach = 40 * this.s + 22;
      if (Math.abs(dx) < reach && dx * this.facing > -10 && sameLevel) {
        a.hit = true;
        p.hurt(this.T.dmg, this.cx);
      }
    }
  }

  // Knife throwers keep their distance and lob knives at the player.
  rangedMove(dist, dir) {
    if (dist > 420) this.vx = dir * this.speed;
    else if (dist < 240) this.vx = -dir * this.speed * 0.7;
    else this.vx = 0;
    if (--this.throwCd <= 0 && this.onGround) { this.aimT = 34; this.vx = 0; }
  }
  throwAt(p) {
    const sx = this.cx + this.facing * 10, sy = this.y + 30 * this.s;
    const dx = p.cx + p.vx * 6 - sx, dy = p.y + 44 - sy;
    const T = clamp(Math.abs(dx) / 10.5, 16, 60);   // flight time in frames
    const err = Math.max(0.03, 0.11 - game.wave * 0.008);
    const vx = dx / T * (1 + rand(-err, err));
    const vy = (dy - 0.5 * KNIFE.gravity * T * T) / T + rand(-1, 1) * err * 6;
    game.knives.push(new Knife(sx, sy, vx, vy, "enemy", { spin: 0.4 }));
    this.throwAnim = 12;
    this.throwCd = rand(140, 220);
    sfx.whoosh(false);
  }

  takeHit(dmg, dirX, kind, heavy) {
    if (this.dead) return false;
    this.flash = 6; this.aimT = 0; this.attack = null;
    this.hp -= kind === "head" ? this.hp : dmg;
    if (this.hp <= 0) { this.die(dirX, kind === "head"); return true; }
    this.vx = dirX * (heavy ? 7 : 3.5) / (this.s * this.s);
    this.vy = heavy ? -3 : -1.5;
    this.onGround = false;
    this.stun = Math.round((heavy ? 20 : 12) / this.s);
    return false;
  }
  die(dirX, headshot) {
    this.dead = true; this.deadT = 0; this.attack = null; this.aimT = 0;
    this.vx = dirX * 3.5; this.vy = -6; this.onGround = false;
    releaseKnives(this);
    game.onKill(this, headshot);
  }

  draw(ctx) {
    const f = this.facing, A = a => (f > 0 ? a : Math.PI - a);
    const moving = Math.abs(this.vx) > 0.4 && this.onGround && !this.dead;
    const run = this.animT * (0.16 + this.speed * 0.05);
    const sw = moving ? Math.sin(run) : 0;
    let armF = A(0.7 - sw * 0.5), armB = A(2.1 + sw * 0.45), knife = A(-0.3), glow = null;
    if (this.dead || this.stun > 0) { armF = A(-1.0); armB = A(-2.1); }
    else if (this.attack) {
      const ph = this.attack.phase;
      if (ph === "windup") { armF = A(-2.2); knife = A(-1.4); glow = "#ffffff"; }
      else if (ph === "active") { armF = A(0.05); knife = A(0); }
      else { armF = A(0.6); knife = A(0.3); }
    } else if (this.aimT > 0) { armF = A(-2.4); knife = A(-1.9); armB = A(-0.2); }
    else if (this.throwAnim > 0) armF = A(0.4);
    drawFigure(ctx, {
      cx: this.cx, bottom: this.bottom, s: this.s, facing: f, rot: this.rot(), color: this.T.color,
      moving, onGround: this.onGround || this.dead, run, armF, armB,
      knife: this.T.fists || this.throwAnim > 0 ? null : knife, knifeGlow: glow, fists: this.T.fists,
      shield: this.shieldUp, flash: this.flash > 0,
      alpha: this.dead ? clamp(1 - (this.deadT - 40) / 30, 0, 1) : 1,
    });
    if (this.dead) return;
    if (this.aimT > 0) {
      text("!", this.cx, this.y - 10, { size: 22, weight: 800, color: "#ffd84d", align: "center" });
    } else if (this.T.hp > 1) {
      for (let i = 0; i < this.T.hp; i++) {
        ctx.fillStyle = i < this.hp ? this.T.color : "rgba(255,255,255,.15)";
        ctx.beginPath();
        ctx.arc(this.cx + (i - (this.T.hp - 1) / 2) * 8, this.y - 9, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function buildWave(n) {
  const weights = [
    ["runner", 3], ["sprinter", n >= 2 ? 2 : 0], ["shield", n >= 3 ? 1.4 : 0],
    ["thrower", n >= 4 ? 1.1 : 0], ["brute", n >= 5 ? 0.9 : 0],
  ];
  const count = Math.min(30, 4 + n * 2);
  const gap = Math.max(26, 95 - n * 7);
  const q = [];
  let at = 20;
  for (let i = 0; i < count; i++) {
    const type = NEW_TYPE[n] && (i === 1 || i === 3) ? NEW_TYPE[n] : weighted(weights);
    const side = n < 3 ? 1 : (Math.random() < 0.6 ? 1 : -1);
    q.push({ type, side, at });
    at += n >= 6 && Math.random() < 0.25 ? 8 : gap * rand(0.5, 1.5);
  }
  return q;
}

// ============ KNIVES ============
class Knife {
  constructor(x, y, vx, vy, owner, o = {}) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.owner = owner;           // "player" | "enemy" | null (loose: harmless, can be picked up)
    this.angle = Math.atan2(vy, vx);
    this.spin = (o.spin ?? (o.power ? 0.62 : 0.48)) * (vx >= 0 ? 1 : -1);
    this.dmg = o.dmg || 1;
    this.power = !!o.power;
    this.pierce = !!o.pierce;
    this.phantom = !!o.phantom;   // the extra knives of a triple throw vanish once they land
    this.counted = !!o.counted;   // counts toward accuracy and can break the combo
    this.handle = owner === "enemy" ? "#3f6b46" : "#7a5230";
    this.state = "fly";           // fly | stuck | recall
    this.host = null;             // { kind: ground | wall | enemy | target, ref, ox, oy, t }
    this.hits = new Set();
    this.hitAny = false;
    this.trail = [];
    this.fade = 0; this.remove = false;
    this.rv = 0; this.delay = 0;
    this.seed = Math.floor(Math.random() * 100);
  }
  get loose() {
    return (this.state === "fly" && this.owner === null) ||
      (this.state === "stuck" && (this.host.kind === "ground" || this.host.kind === "wall"));
  }

  update() {
    if (this.fade > 0 && --this.fade <= 0) { this.remove = true; return; }
    if (this.state === "recall") { this.updateRecall(); return; }
    if (this.state === "stuck") { this.updateStuck(); return; }

    this.trail.push(this.x, this.y);
    if (this.trail.length > 12) this.trail.splice(0, 2);
    const n = Math.max(1, Math.ceil(Math.hypot(this.vx, this.vy) / 6));
    for (let i = 0; i < n && this.state === "fly"; i++) {
      this.x += this.vx / n;
      this.y += this.vy / n;
      this.collide();
    }
    if (this.state === "fly") {
      this.vy += this.owner ? KNIFE.gravity : KNIFE.looseGravity;
      this.angle += this.spin;
    }
  }

  updateStuck() {
    const h = this.host;
    h.t++;
    if (h.ref) { this.x = h.ref.x + h.ox; this.y = h.ref.y + h.oy; }
    if (game.mode === "range") {
      if (!this.fade && h.t > (h.kind === "target" ? 100 : 45)) this.fade = 20;
    } else if (h.kind === "wall" && h.t > 150) {
      this.loosen(this.x < W / 2 ? 1 : -1);    // slides out of the wall so it can be picked up
    }
  }

  updateRecall() {
    if (this.delay > 0) { this.delay--; return; }
    const s = game.player.shoulder, dx = s.x - this.x, dy = s.y - this.y, d = Math.hypot(dx, dy);
    this.rv = Math.min(this.rv + 0.7, 26);
    this.angle += 0.4;
    if (d <= this.rv + 4) {
      this.remove = true;
      if (game.player.belt < BELT_MAX) game.player.belt++;
      sfx.tick();
      return;
    }
    this.x += dx / d * this.rv;
    this.y += dy / d * this.rv;
  }

  collide() {
    const sp = Math.hypot(this.vx, this.vy) || 1;
    const px = this.x + this.vx / sp * KNIFE.probe, py = this.y + this.vy / sp * KNIFE.probe;

    if (this.owner === "player") {
      for (const e of game.enemies) {
        if (e.dead || this.hits.has(e)) continue;
        const part = e.hitTest(px, py);
        if (!part) continue;
        if (part === "shield") {
          if (this.power) {      // a power throw smashes the shield off
            e.shieldUp = false;
            e.stun = 30; e.vx = Math.sign(this.vx) * 6; e.attack = null; e.aimT = 0;
            this.markHit();
            burst(px, py, 14, "#ffe9a8", { max: 5 });
            game.float(e.cx, e.y - 14, "SHIELD BROKEN", "#cfd8e8", 15);
            game.shake = Math.max(game.shake, 5);
          } else {
            e.vx += Math.sign(this.vx) * 2;
            if (this.counted && !this.hitAny) game.onMiss();
          }
          this.bounce();
          return;
        }
        this.hits.add(e);
        this.markHit();
        const killed = e.takeHit(this.dmg, Math.sign(this.vx) || 1, part, this.power);
        burst(px, py, part === "head" ? 16 : 10, e.T.color, { max: 5 });
        if (part === "head") sfx.headshot(); else sfx.hit();
        if (this.pierce) continue;
        if (killed) this.loosen(-Math.sign(this.vx) * 0.6);
        else this.stick("enemy", e);
        return;
      }
      for (const t of game.targets) {
        if (t.dead || this.hits.has(t)) continue;
        const part = t.hitTest(px, py);
        if (!part) continue;
        this.hits.add(t);
        const res = t.onKnife(this, part, px, py);
        if (res === "stick") { this.stick("target", t); return; }
        if (res === "bounce") { this.bounce(); return; }
      }
      for (const o of game.knives) {
        if (o.owner === "enemy" && o.state === "fly" && Math.hypot(o.x - this.x, o.y - this.y) < CLASH_RADIUS) {
          this.markHit();
          game.addScore(75, this.x, this.y - 16, "CLASH!", "#8fd0ff");
          o.bounce(); this.bounce();
          return;
        }
      }
    } else if (this.owner === "enemy") {
      const p = game.player;
      if (!p.dead && px > p.x - 2 && px < p.x + p.w + 2 && py > p.y && py < p.bottom && p.hurt(1, this.x)) {
        this.loosen(-Math.sign(this.vx) * 0.5);
        return;
      }
    }

    const wallR = game.mode === "range" ? W - 14 : W;
    if (px < 0 || px > wallR) {
      this.stick("wall");
      sfx.thunk();
      burst(clamp(px, 0, wallR), py, 6, "#8a7a64", { max: 3 });
      return;
    }
    for (const pl of PLATFORMS) {
      if (inRect(px, py, pl)) {
        this.stick("ground");
        sfx.dirt();
        burst(px, py, 6, "#6b5a48", { angle: -Math.PI / 2, spread: 1.1, max: 3 });
        return;
      }
    }
  }

  markHit() {
    game.comboHit();
    if (!this.hitAny && this.counted) game.stats.hits++;
    this.hitAny = true;
  }

  stick(kind, ref = null) {
    this.state = "stuck";
    this.angle = Math.atan2(this.vy, this.vx);
    const depth = kind === "ground" || kind === "wall" ? 7 : 4;   // sink the blade in
    this.x += Math.cos(this.angle) * depth;
    this.y += Math.sin(this.angle) * depth;
    this.host = { kind, ref, ox: ref ? this.x - ref.x : 0, oy: ref ? this.y - ref.y : 0, t: 0 };
    this.trail.length = 0;
    if (kind === "ground" || kind === "wall") {
      if (this.owner === "player" && this.counted && !this.hitAny) game.onMiss();
      this.owner = null;
    }
    if (this.phantom) this.fade = this.fade || 16;
  }

  loosen(dirX) {
    this.state = "fly"; this.host = null; this.owner = null;
    this.vx = (dirX ?? rand(-1, 1)) * rand(1, 2.5);
    this.vy = rand(-4.5, -2);
    this.spin = rand(-0.35, 0.35);
    this.trail.length = 0;
    if (this.phantom) this.fade = this.fade || 15;
  }

  bounce() {
    this.owner = null;
    this.vx = -this.vx * 0.25 + rand(-1, 1);
    this.vy = -Math.abs(this.vy) * 0.2 - 3;
    this.spin = rand(-0.5, 0.5);
    this.trail.length = 0;
    sfx.clank();
    burst(this.x, this.y, 8, "#ffe9a8", { max: 4, g: 0.15 });
  }

  recall(i) {
    this.state = "recall"; this.host = null; this.owner = null;
    this.rv = 0; this.delay = Math.min(40, i * 3);
    this.trail.length = 0;
  }

  draw(ctx) {
    ctx.globalAlpha = this.fade ? this.fade / 20 : 1;
    if (this.state === "fly" && this.owner && this.trail.length >= 4) {
      ctx.strokeStyle = this.power ? "rgba(255,157,92,.4)" : this.pierce ? "rgba(111,211,255,.45)"
        : this.owner === "enemy" ? "rgba(255,93,108,.35)" : "rgba(255,255,255,.18)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.trail[0], this.trail[1]);
      for (let i = 2; i < this.trail.length; i += 2) ctx.lineTo(this.trail[i], this.trail[i + 1]);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }
    const glow = this.state === "fly" && this.owner ? (this.power ? "#ff9d5c" : this.pierce ? "#6fd3ff" : null) : null;
    drawKnife(ctx, this.x, this.y, this.angle, { glow, handle: this.handle });
    // A glint now and then on knives lying around, so they read as pickups.
    if (game.mode === "survival" && this.loose && this.state === "stuck" && (game.t + this.seed) % 110 < 7) {
      const q = ((game.t + this.seed) % 110) / 7;
      ctx.fillStyle = `rgba(255,255,255,${1 - q})`;
      const gx = this.x - Math.cos(this.angle) * 8, gy = this.y - Math.sin(this.angle) * 8;
      ctx.fillRect(gx - 5 * q - 1, gy - 1, 10 * q + 2, 2);
      ctx.fillRect(gx - 1, gy - 5 * q - 1, 2, 10 * q + 2);
    }
    ctx.globalAlpha = 1;
  }
}

function releaseKnives(ref) {
  for (const k of game.knives) {
    if (k.state !== "stuck" || k.host.ref !== ref) continue;
    if (game.mode === "range") k.fade = k.fade || 12;
    else k.loosen();
  }
}

function collectKnives() {
  const p = game.player;
  if (p.dead) return;
  for (const k of game.knives) {
    if (p.belt >= BELT_MAX) return;
    if (k.remove || k.fade || k.phantom || !k.loose) continue;
    if (k.x > p.x - 14 && k.x < p.x + p.w + 14 && k.y > p.y - 8 && k.y < p.bottom + 14) {
      k.remove = true;
      p.belt++;
      sfx.pickup();
      game.float(k.x, k.y - 12, "+1", "#cfd8e8", 13);
    }
  }
}

// ============ TARGETS ============
class Board {
  constructor(o) {
    Object.assign(this, { R: 30, hp: 3, motion: "post", life: Infinity, amp: 0, speed: 0, base: GROUND_Y, bonus: false }, o);
    this.x0 = this.x; this.y0 = this.y;
    this.t = 0; this.phase = rand(0, Math.PI * 2);
    this.alpha = 0; this.leaving = false; this.dead = false; this.wobble = 0;
    this.rise = this.motion === "pop" ? 0 : 1;
    this.move();
  }
  move() {
    const ph = this.phase + this.t * this.speed;
    if (this.motion === "rail") this.x = this.x0 + Math.sin(ph) * this.amp;
    else if (this.motion === "swing") {
      const a = Math.sin(ph) * this.amp;
      this.x = this.px + Math.sin(a) * this.len;
      this.y = this.py + Math.cos(a) * this.len;
    } else if (this.motion === "pop") this.y = lerp(GROUND_Y + this.R + 30, this.y0, this.rise);
  }
  update() {
    this.t++;
    this.wobble = Math.max(0, this.wobble - 0.08);
    if (this.t > this.life) this.leaving = true;
    if (this.motion === "pop") {
      this.alpha = 1;
      this.rise += ((this.leaving ? 0 : 1) - this.rise) * 0.2;
      if (this.leaving && this.rise < 0.04) this.dead = true;
    } else {
      this.alpha = this.leaving ? this.alpha - 0.06 : Math.min(1, this.alpha + 0.08);
      if (this.leaving && this.alpha <= 0) this.dead = true;
    }
    this.move();
  }
  hitTest(px, py) {
    if (this.leaving || this.rise < 0.7) return null;
    return Math.hypot(px - this.x, py - this.y) < this.R ? "board" : null;
  }
  onKnife(k, part, px, py) {
    const d = Math.hypot(px - this.x, py - this.y) / this.R;
    const ring = d < 0.22 ? 0 : d < 0.5 ? 1 : d < 0.8 ? 2 : 3;
    let pts = [100, 50, 25, 10][ring];
    if (game.mode === "range") {
      pts *= (1 + Math.max(0, this.x - RANGE_ZONE) / 700) * ({ pop: 1.3, rail: 1.4, swing: 1.5 }[this.motion] || 1);
    } else pts *= 2;
    k.markHit();
    if (ring === 0) {
      game.stats.bulls++;
      sfx.bullseye();
      if (this.bonus) game.pickups.push(new Pickup(this.x, this.y + this.R, randomDrop()));
    } else sfx.thunk();
    game.addScore(pts, this.x, this.y - this.R - 12, ring === 0 ? "BULLSEYE!" : null, ring === 0 ? "#ffd84d" : "#ffe27a");
    burst(px, py, 8, "#d9b98a", { max: 3.5 });
    this.wobble = 1;
    if (--this.hp <= 0) this.shatter();
    return "stick";
  }
  shatter() {
    this.dead = true;
    burst(this.x, this.y, 26, "#c79a5f", { max: 6, smin: 2, smax: 5 });
    burst(this.x, this.y, 10, "#d8433a", { max: 5 });
    sfx.crack();
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = clamp(this.alpha, 0, 1);
    const R = this.R * (1 + Math.sin(this.wobble * 14) * this.wobble * 0.06);
    ctx.fillStyle = "#5a4128";
    ctx.strokeStyle = "#8a7356";
    ctx.lineWidth = 2;
    if (this.motion === "post" || this.motion === "pop") {
      const bottom = this.motion === "pop" ? GROUND_Y + 40 : this.base;
      ctx.fillRect(this.x - 3, this.y, 6, bottom - this.y);
    } else if (this.motion === "rail") {
      ctx.beginPath();
      for (const s of [-1, 1]) {
        ctx.moveTo(this.x + s * R * 0.55, RAIL_Y);
        ctx.lineTo(this.x + s * R * 0.55, this.y - R * 0.8);
      }
      ctx.stroke();
      ctx.fillStyle = "#6a7590";
      for (const s of [-1, 1]) ctx.fillRect(this.x + s * R * 0.55 - 4, RAIL_Y - 5, 8, 6);
    } else if (this.motion === "swing") {
      ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(this.x, this.y); ctx.stroke();
      ctx.fillStyle = "#6a7590";
      ctx.beginPath(); ctx.arc(this.px, this.py, 4, 0, Math.PI * 2); ctx.fill();
    }
    if (this.bonus) {
      ctx.strokeStyle = `rgba(255,216,77,${0.35 + 0.25 * Math.sin(this.t * 0.12)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(this.x, this.y, R + 8, 0, Math.PI * 2); ctx.stroke();
    }
    const rings = [[R + 3, "#6b4a2a"], [R, "#efe8da"], [R * 0.8, "#d8433a"], [R * 0.5, "#efe8da"], [R * 0.22, "#ffcf3f"]];
    for (const [r, c] of rings) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.fill();
    }
    if (this.hp < 3) {          // cracks
      ctx.strokeStyle = "rgba(60,36,20,.7)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(this.x - R * 0.9, this.y - R * 0.2); ctx.lineTo(this.x - R * 0.3, this.y + R * 0.1);
      if (this.hp < 2) { ctx.moveTo(this.x + R * 0.2, this.y - R * 0.95); ctx.lineTo(this.x + R * 0.45, this.y - R * 0.3); }
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Balloon {
  constructor(x, y, vx, vy, payload = null) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.payload = payload;
    this.r = payload ? 17 : 15;
    this.color = pick(BALLOON_COLORS);
    this.t = rand(0, 100);
    this.dead = false;
  }
  update() {
    this.t++;
    this.x += this.vx + Math.sin(this.t * 0.05) * 0.35;
    this.y += this.vy + Math.sin(this.t * 0.07) * 0.25;
    if (this.y < -80 || this.x < -70 || this.x > W + 70) this.dead = true;
  }
  hitTest(px, py) {
    const dx = (px - this.x) / this.r, dy = (py - this.y) / (this.r * 1.2);
    return dx * dx + dy * dy < 1 ? "balloon" : null;
  }
  onKnife(k) {
    this.dead = true;
    k.markHit();
    burst(this.x, this.y, 14, this.color, { max: 5, g: 0.1 });
    sfx.pop();
    game.addScore(this.payload ? 50 : 40, this.x, this.y - 20, "POP", "#ffe27a");
    if (this.payload) game.pickups.push(new Pickup(this.x, this.y + this.r * 1.2 + 38, this.payload, 0));
    return "pass";     // the knife keeps flying
  }
  draw(ctx) {
    const by = this.y + this.r * 1.2;
    ctx.strokeStyle = "rgba(220,228,240,.5)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x, by);
    ctx.quadraticCurveTo(this.x + Math.sin(this.t * 0.1) * 5, by + 14, this.x, by + 30);
    ctx.stroke();
    if (this.payload) {
      const cy = by + 30;
      ctx.fillStyle = "#7a5a36"; ctx.fillRect(this.x - 11, cy, 22, 17);
      ctx.strokeStyle = "#4e3820"; ctx.lineWidth = 2; ctx.strokeRect(this.x - 11, cy, 22, 17);
      ctx.fillStyle = PICKUPS[this.payload].col; ctx.fillRect(this.x - 3, cy + 4, 6, 9);
    }
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.ellipse(this.x, this.y, this.r, this.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(this.x, by - 2); ctx.lineTo(this.x - 4, by + 4); ctx.lineTo(this.x + 4, by + 4); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(this.x - this.r * 0.35, this.y - this.r * 0.45, this.r * 0.22, this.r * 0.4, -0.4, 0, Math.PI * 2); ctx.fill();
  }
}

// Target range only: a brave volunteer with an apple on their head.
class Volunteer {
  constructor() {
    this.w = FIGHTER_W; this.h = FIGHTER_H;
    this.x = W + 10; this.y = GROUND_Y - this.h;
    this.standX = rand(560, 830);
    this.state = "walkin";      // walkin | stand | cheer | leave | flee
    this.t = 0; this.apple = true; this.facing = -1; this.flash = 0; this.dead = false;
  }
  get cx() { return this.x + this.w / 2; }
  get bottom() { return this.y + this.h; }
  update() {
    this.t++;
    if (this.flash > 0) this.flash--;
    if (this.state === "walkin") {
      this.x -= 2.2;
      if (this.x <= this.standX) { this.x = this.standX; this.state = "stand"; this.t = 0; }
    } else if (this.state === "stand") {
      if (this.t > 420) this.state = "leave";
    } else if (this.state === "cheer") {
      if (this.t > 50) this.state = "leave";
    } else {
      this.facing = 1;
      this.x += this.state === "flee" ? 5 : 2.2;
      if (this.x > W + 40) this.dead = true;
    }
  }
  hitTest(px, py) {
    if ((this.state !== "stand" && this.state !== "walkin") || this.x > W - 50) return null;
    if (this.apple && Math.hypot(px - this.cx, py - (this.y - 4)) < 10) return "apple";
    if (px > this.x - 2 && px < this.x + this.w + 2 && py > this.y + 2 && py < this.bottom) return "body";
    return null;
  }
  onKnife(k, part) {
    if (part === "apple") {
      this.apple = false;
      this.state = "cheer"; this.t = 0;
      k.markHit();
      game.stats.apples++;
      burst(this.cx, this.y - 4, 14, "#e0483e", { max: 4 });
      burst(this.cx, this.y - 4, 6, "#f3e3b5", { max: 3 });
      sfx.bullseye();
      game.addScore(250 * (1 + Math.max(0, this.x - RANGE_ZONE) / 700), this.cx, this.y - 30, "WILLIAM TELL!", "#7fe08a");
      return "pass";
    }
    this.flash = 8;
    this.state = "flee"; this.t = 0;
    game.onMiss();
    game.addScore(-150, this.cx, this.y - 20, "OUCH!", "#ff7b7b");
    sfx.ouch();
    return "bounce";
  }
  draw(ctx) {
    const f = this.facing, A = a => (f > 0 ? a : Math.PI - a);
    const moving = this.state === "walkin" || this.state === "leave" || this.state === "flee";
    let armF = A(1.3), armB = A(1.85);
    if (this.state === "cheer") { armF = A(-1.25); armB = A(-1.9); }
    else if (this.state === "flee") { armF = A(-1.0 + Math.sin(this.t * 0.5) * 0.6); armB = A(-2.1 - Math.sin(this.t * 0.5) * 0.6); }
    const tremble = this.state === "stand" ? Math.sin(this.t * 1.7) * 0.8 : 0;
    drawFigure(ctx, {
      cx: this.cx + tremble, bottom: this.bottom, facing: f, color: "#e8e2d4",
      moving, onGround: true, run: this.t * (this.state === "flee" ? 0.5 : 0.25),
      armF, armB, knife: null, flash: this.flash > 0,
    });
    if (this.apple) {
      const ax = this.cx + tremble, ay = this.y - 4;
      ctx.fillStyle = "#e0483e";
      ctx.beginPath(); ctx.arc(ax, ay, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.arc(ax - 3, ay - 3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#6b4a2a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, ay - 7); ctx.lineTo(ax + 1, ay - 12); ctx.stroke();
      ctx.fillStyle = "#7fe08a";
      ctx.beginPath(); ctx.ellipse(ax + 5, ay - 11, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============ PICKUPS ============
class Pickup {
  constructor(x, y, type, vy = -3) {
    this.x = x; this.y = y; this.vx = rand(-1, 1); this.vy = vy;
    this.type = type; this.t = 0; this.onGround = false; this.dead = false;
  }
  update() {
    this.t++;
    if (!this.onGround) {
      this.vy = Math.min(this.vy + 0.35, 9);
      this.x = clamp(this.x + this.vx, 16, W - 16);
      this.y += this.vy;
      for (const p of PLATFORMS) {
        if (this.vy > 0 && this.y + 13 >= p.y && this.y + 13 <= p.y + 18 && this.x > p.x && this.x < p.x + p.w) {
          this.y = p.y - 13; this.vy = 0; this.onGround = true;
        }
      }
    }
    if (this.t > 600) this.dead = true;
    const pl = game.player;
    if (!pl.dead && Math.abs(pl.cx - this.x) < 26 && this.y > pl.y - 14 && this.y < pl.bottom + 14) this.collect();
  }
  collect() {
    const p = game.player;
    this.dead = true;
    if (this.type === "heart") p.hp = Math.min(MAX_HP, p.hp + 1);
    else if (this.type === "knives") p.belt = Math.min(BELT_MAX, p.belt + 3);
    else p.power = { type: this.type, n: POWER_THROWS };
    game.float(p.cx, p.y - 24, PICKUPS[this.type].label, PICKUPS[this.type].col, 16);
    sfx.power();
  }
  draw(ctx) {
    if (this.t > 480 && Math.floor(this.t / 6) % 2) return;     // blink before it vanishes
    drawPickupIcon(ctx, this.x, this.y + (this.onGround ? Math.sin(this.t * 0.1) * 2 - 3 : 0), this.type);
  }
}

function drawPickupIcon(ctx, x, y, type) {
  const col = PICKUPS[type].col;
  ctx.save();
  ctx.fillStyle = "rgba(10,14,22,.8)";
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  if (type === "heart") drawHeart(ctx, x, y + 1, 6.5, col);
  else if (type === "triple") for (const a of [-0.5, 0, 0.5]) drawKnife(ctx, x + Math.sin(a) * 2, y + 1, -Math.PI / 2 + a, { scale: 0.42 });
  else if (type === "pierce") {
    drawKnife(ctx, x - 1, y, 0, { scale: 0.55 });
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 9, y - 5); ctx.lineTo(x - 4, y - 5); ctx.moveTo(x - 9, y + 5); ctx.lineTo(x - 4, y + 5); ctx.stroke();
  } else {
    drawKnife(ctx, x, y, -Math.PI / 4, { scale: 0.5 });
    drawKnife(ctx, x, y, -Math.PI * 3 / 4, { scale: 0.5 });
  }
  ctx.restore();
}

function randomDrop() {
  const p = game.player;
  return weighted([["heart", p.hp < MAX_HP ? 3 : 0.5], ["triple", 2], ["pierce", 2], ["knives", p.belt < 4 ? 3 : 1.5]]);
}

// ============ EFFECTS ============
function burst(x, y, n, color, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.angle !== undefined ? o.angle + rand(-o.spread, o.spread) : rand(0, Math.PI * 2);
    const sp = rand(o.min ?? 1, o.max ?? 5);
    const life = rand(16, 32);
    game.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life,
      color, size: rand(o.smin ?? 1.5, o.smax ?? 3.5), g: o.g ?? 0.2,
    });
  }
}

// ============ GAME / STATE ============
const game = {
  mode: "survival",
  state: "menu",          // menu | play | paused | over
  phase: "",              // survival: intro | fight | clear | dying · range: fight | timeup
  phaseT: 0, t: 0,
  player: null,
  enemies: [], knives: [], targets: [], pickups: [], particles: [], floaters: [],
  score: 0, combo: 0, wave: 0, speedMul: 1,
  spawnQueue: [], spawnT: 0, balloonAt: 0,
  timeLeft: 0, volunteerT: 0, balloonT: 0,
  shake: 0, slowmo: 0, hurtFlash: 0, banner: null, overT: 0, noAmmoT: 0, newBest: false,
  stats: null,
  best: { survival: loadBest("kt_best_survival"), range: loadBest("kt_best_range") },

  get mult() { return Math.min(5, 1 + Math.floor(this.combo / (this.mode === "range" ? 3 : 4))); },
  get canThrow() { return this.phase !== "dying" && this.phase !== "timeup"; },

  start(mode) {
    this.mode = mode;
    this.state = "play";
    this.phaseT = 0;
    this.enemies = []; this.knives = []; this.targets = []; this.pickups = [];
    this.particles = []; this.floaters = [];
    this.score = 0; this.combo = 0; this.wave = 0;
    this.slowmo = 0; this.shake = 0; this.hurtFlash = 0; this.noAmmoT = 0; this.newBest = false;
    this.banner = null;
    this.stats = { throws: 0, hits: 0, kills: 0, headshots: 0, bulls: 0, apples: 0, bestCombo: 0 };
    this.player.reset(mode === "range" ? 100 : W / 2 - FIGHTER_W / 2);
    if (mode === "survival") {
      this.nextWave();
    } else {
      this.phase = "fight";
      this.timeLeft = RANGE_TIME;
      this.spawnT = 0; this.volunteerT = 360; this.balloonT = 150;
      for (const kind of ["post", "post", "pop"]) spawnRangeBoard(kind, 1);
      this.showBanner("TARGET RANGE", "60 seconds — hit the targets, spare the volunteer", 150);
      sfx.wave();
    }
  },

  nextWave() {
    this.wave++;
    this.phase = "intro"; this.phaseT = 0; this.spawnT = 0;
    this.speedMul = 1 + Math.min(0.5, (this.wave - 1) * 0.05);
    this.spawnQueue = buildWave(this.wave);
    this.balloonAt = Math.round(rand(0.25, 0.7) * this.spawnQueue[this.spawnQueue.length - 1].at) + 60;
    if (this.wave >= 2) {
      this.targets.push(new Board({ x: W / 2, y: RAIL_Y + 62, R: 26, motion: "rail", amp: 330, speed: 0.008 + this.wave * 0.0008, bonus: true }));
    }
    this.showBanner(`WAVE ${this.wave}`, WAVE_INTRO[this.wave] || "Hold the line", 150);
    sfx.wave();
  },

  waveClear() {
    this.phase = "clear"; this.phaseT = 0;
    const bonus = 200 * this.wave;
    this.score += bonus;
    this.showBanner("WAVE CLEAR", `+${bonus.toLocaleString()} bonus · your knives fly back to you`, 150);
    sfx.clear();
    let i = 0;
    for (const k of this.knives) if (!k.phantom && !k.remove && !k.fade) k.recall(i++);
    for (const t of this.targets) if (t instanceof Board) t.leaving = true;
  },

  onKill(e, headshot) {
    const pts = headshot ? Math.round(e.T.score * 1.5) : e.T.score;
    this.addScore(pts, e.cx, e.y - 12, headshot ? "HEADSHOT" : null, headshot ? "#ff7b7b" : "#ffe27a");
    this.stats.kills++;
    if (headshot) { this.stats.headshots++; this.slowmo = Math.max(this.slowmo, 10); }
    this.shake = Math.max(this.shake, headshot ? 7 : 4);
    if (Math.random() < 0.08) this.pickups.push(new Pickup(e.cx, e.y + 30, randomDrop()));
    if (this.spawnQueue.length === 0 && this.enemies.every(o => o.dead)) this.slowmo = 30;
  },

  playerDied() {
    this.phase = "dying"; this.phaseT = 0;
    this.slowmo = 60;
    this.showBanner("YOU'RE DOWN", "", 120);
  },

  endGame() {
    this.state = "over"; this.overT = 0; this.banner = null;
    const prev = this.best[this.mode];
    if (this.score > prev) {
      this.best[this.mode] = this.score;
      saveBest("kt_best_" + this.mode, this.score);
      this.newBest = true;
    }
    if (this.mode === "survival") sfx.over(); else sfx.clear();
  },

  addScore(base, x, y, label, col = "#ffe27a") {
    const pts = base > 0 ? Math.round(base * this.mult / 5) * 5 : Math.round(base);
    this.score = Math.max(0, this.score + pts);
    this.float(x, y, (label ? label + " " : "") + (pts >= 0 ? "+" : "") + pts, col, label ? 19 : 16);
  },
  comboHit() {
    this.combo++;
    this.stats.bestCombo = Math.max(this.stats.bestCombo, this.combo);
  },
  comboBreak() {
    if (this.combo >= 4) this.float(this.player.cx, this.player.y - 34, "COMBO LOST", "#ff7b7b", 14);
    this.combo = 0;
  },
  onMiss() { this.comboBreak(); },
  float(x, y, txt, col, size = 16) {
    this.floaters.push({ x, y, txt, col, size, t: 50 });
  },
  showBanner(title, sub, dur) {
    this.banner = { title, sub, t: 0, dur };
  },
};
game.player = new Player();

function updateWorld() {
  const g = game;
  g.phaseT++;
  if (g.banner && ++g.banner.t > g.banner.dur) g.banner = null;
  g.player.update();
  for (const e of g.enemies) e.update(g.player);
  separateEnemies();
  for (const t of g.targets) t.update();
  for (const k of g.knives) k.update();
  if (g.mode === "survival") collectKnives();
  for (const p of g.pickups) p.update();

  for (const t of g.targets) if (t.dead) releaseKnives(t);
  g.enemies = g.enemies.filter(e => !(e.dead && e.deadT > 70));
  g.targets = g.targets.filter(t => !t.dead);
  g.knives = g.knives.filter(k => !k.remove);
  g.pickups = g.pickups.filter(p => !p.dead);

  for (const p of g.particles) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.97; p.life--; }
  g.particles = g.particles.filter(p => p.life > 0);
  for (const fl of g.floaters) { fl.t--; fl.y -= 0.7; }
  g.floaters = g.floaters.filter(fl => fl.t > 0);
  g.shake = Math.max(0, g.shake - 0.6);
  if (g.hurtFlash > 0) g.hurtFlash--;

  if (g.mode === "survival") updateSurvival(); else updateRange();
}

function updateSurvival() {
  const g = game;
  if (g.phase === "intro") {
    if (g.phaseT > 90) { g.phase = "fight"; g.phaseT = 0; }
  } else if (g.phase === "fight") {
    g.spawnT++;
    while (g.spawnQueue.length && g.spawnQueue[0].at <= g.spawnT) {
      const s = g.spawnQueue.shift();
      g.enemies.push(new Enemy(s.type, s.side, g.speedMul));
    }
    if (g.balloonAt && g.spawnT >= g.balloonAt) {
      g.balloonAt = 0;
      const dir = Math.random() < 0.5 ? 1 : -1;
      g.targets.push(new Balloon(dir > 0 ? -30 : W + 30, rand(110, 180), dir * rand(1.1, 1.6), 0, randomDrop()));
    }
    ammoSafetyNet();
    if (!g.spawnQueue.length && g.enemies.every(e => e.dead)) g.waveClear();
  } else if (g.phase === "clear") {
    if (g.phaseT > 170) g.nextWave();
  } else if (g.phase === "dying") {
    if (g.phaseT > 110) g.endGame();
  }
}

// If every knife is gone (stuck in attackers, out of reach...), drop a fresh bundle near the player.
function ammoSafetyNet() {
  const g = game, p = g.player;
  const reachable = g.knives.some(k => !k.phantom && k.state !== "recall" &&
    ((k.state === "fly" && k.owner !== "enemy") || k.loose));
  const crate = g.pickups.some(q => q.type === "knives");
  if (p.belt === 0 && !reachable && !crate) {
    if (++g.noAmmoT > 120) {
      g.pickups.push(new Pickup(clamp(p.cx + rand(-120, 120), 40, W - 40), -20, "knives", 0));
      g.float(W / 2, 150, "SUPPLY DROP", "#dfe6f2", 18);
      g.noAmmoT = 0;
    }
  } else g.noAmmoT = 0;
}

function updateRange() {
  const g = game;
  if (g.phase === "fight") {
    g.timeLeft--;
    if (g.timeLeft > 0 && g.timeLeft <= 300 && g.timeLeft % 60 === 0) sfx.tick();
    rangeSpawn();
    if (g.timeLeft <= 0) {
      g.phase = "timeup"; g.phaseT = 0;
      g.showBanner("TIME!", "", 110);
      for (const t of g.targets) if (t instanceof Board) t.leaving = true;
      sfx.clear();
    }
  } else if (g.phase === "timeup" && g.phaseT > 110) g.endGame();
}

function rangeSpawn() {
  const g = game;
  const prog = 1 - g.timeLeft / RANGE_TIME, diff = 1 + prog * 0.8;
  const boards = g.targets.filter(t => t instanceof Board && !t.leaving);
  if (--g.spawnT <= 0 && boards.length < (prog < 0.5 ? 3 : 4)) {
    g.spawnT = 30;
    const moving = boards.filter(t => t.motion === "rail" || t.motion === "swing").length;
    spawnRangeBoard(weighted([
      ["post", 3], ["ledge", 1.2], ["pop", 2.2],
      ["rail", prog > 0.12 && moving < 1 ? 1.6 : 0],
      ["swing", prog > 0.3 && moving < 2 ? 1.4 : 0],
    ]), diff);
  }
  if (!g.targets.some(t => t instanceof Volunteer) && --g.volunteerT <= 0) {
    g.targets.push(new Volunteer());
    g.volunteerT = rand(480, 720);
  }
  if (--g.balloonT <= 0) {
    g.balloonT = rand(170, 280) / diff;
    const bx = rand(430, 860), n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      g.targets.push(new Balloon(bx + rand(-50, 50), H + 20 + i * 34, rand(-0.3, 0.3), -rand(1.1, 1.7) * Math.sqrt(diff)));
    }
  }
}

function spawnRangeBoard(kind, diff) {
  const R = Math.round(clamp(32 - (diff - 1) * 10, 24, 32));
  for (let tries = 0; tries < 12; tries++) {
    let o;
    if (kind === "post") {
      const x = rand(400, 890), underLedge = x > 570 && x < 830;
      o = { x, y: GROUND_Y - (underLedge ? rand(66, 86) : rand(70, 170)), motion: "post", base: GROUND_Y, life: 420 };
    } else if (kind === "ledge") {
      o = { x: rand(625, 775), y: 330 - rand(56, 90), motion: "post", base: 330, life: 480 };
    } else if (kind === "pop") {
      o = { x: rand(420, 890), y: GROUND_Y - rand(62, 90), motion: "pop", life: Math.round(150 / diff) };
    } else if (kind === "rail") {
      o = { x: rand(540, 740), y: RAIL_Y + 72, motion: "rail", amp: rand(90, 160), speed: 0.02 * diff, life: 540 };
    } else {
      const px = rand(480, 840);
      o = { px, py: RAIL_Y, len: rand(110, 165), amp: rand(0.4, 0.7), speed: 0.035 * diff, motion: "swing", life: 540, x: px, y: RAIL_Y + 140 };
    }
    const crowded = game.targets.some(t => t instanceof Board && Math.hypot(t.x - o.x, t.y - o.y) < t.R + R + 24);
    if (crowded && tries < 11) continue;
    game.targets.push(new Board({ R, ...o }));
    return;
  }
}

function separateEnemies() {
  const es = game.enemies.filter(e => !e.dead);
  for (let i = 0; i < es.length; i++) {
    for (let j = i + 1; j < es.length; j++) {
      const a = es[i], b = es[j], dx = b.cx - a.cx;
      if (Math.abs(dx) < 18 && Math.abs(a.bottom - b.bottom) < 30) {
        const push = (18 - Math.abs(dx)) * 0.15 * (dx >= 0 ? 1 : -1);
        a.x -= push; b.x += push;
      }
    }
  }
}

// ============ MAIN LOOP ============
const MENU_CARDS = [
  { mode: "survival", key: "1", x: 150, y: 140, w: 310, h: 140, title: "SURVIVAL",
    lines: ["Waves of attackers run at you.", "Throw to survive, grab your knives back."] },
  { mode: "range", key: "2", x: 500, y: 140, w: 310, h: 140, title: "TARGET RANGE",
    lines: ["60 seconds of bullseyes, balloons", "and one very brave volunteer."] },
];

function tick() {
  const g = game;
  g.t++;
  if (pressed.KeyM) { sfx.toggle(); delete pressed.KeyM; }

  if (g.state === "menu") {
    if (pressed.Digit1 || pressed.Numpad1) g.start("survival");
    else if (pressed.Digit2 || pressed.Numpad2) g.start("range");
    else if (mouse.pressed) {
      const card = MENU_CARDS.find(c => inRect(mouse.x, mouse.y, c));
      if (card) g.start(card.mode);
    }
    clearInput();
    return;
  }
  if (g.state === "over") {
    g.overT++;
    if (pressed.Escape) g.state = "menu";
    else if (g.overT > 40 && (pressed.Enter || pressed.Space || pressed.KeyR || mouse.pressed)) g.start(g.mode);
    clearInput();
    return;
  }
  if (g.state === "paused") {
    if (pressed.KeyP || pressed.Enter || mouse.pressed) g.state = "play";
    else if (pressed.Escape) g.state = "menu";
    else if (pressed.KeyR) g.start(g.mode);
    clearInput();
    return;
  }
  if (pressed.KeyP || pressed.Escape) { g.state = "paused"; clearInput(); return; }
  if (pressed.KeyR) { g.start(g.mode); clearInput(); return; }
  // Slow motion: skip every other tick, keeping unread input for the next one.
  if (g.slowmo > 0 && --g.slowmo % 2 === 1) return;
  updateWorld();
  clearInput();
}

// Fixed 60 Hz simulation regardless of monitor refresh rate.
const STEP = 1000 / 60;
let lastTime = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(200, now - lastTime);
  lastTime = now;
  let n = 0;
  while (acc > STEP * 0.92 && n < 6) { tick(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  requestAnimationFrame(loop);
}

// Render at the canvas's on-screen size (crisp on large and high-DPI screens).
function fit() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(W / 2, Math.round(r.width * dpr));
  if (canvas.width !== w) { canvas.width = w; canvas.height = Math.round(w * H / W); }
}

// ============ DRAWING ============
function text(str, x, y, { size = 16, weight = 600, color = "#dfe6f2", align = "left", spacing = 0, shadow = false } = {}) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  const ls = spacing && "letterSpacing" in ctx;
  if (ls) ctx.letterSpacing = spacing + "px";
  if (shadow) { ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 14; }
  ctx.fillText(str, x, y);
  if (ls) ctx.letterSpacing = "0px";
  if (shadow) ctx.shadowBlur = 0;
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHeart(ctx, x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
}

// Knife centered on (x, y), tip pointing along angle a.
function drawKnife(ctx, x, y, a, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  if (o.scale) ctx.scale(o.scale, o.scale);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 12; }
  ctx.fillStyle = "#dfe6f2";
  ctx.beginPath();
  ctx.moveTo(-4, -2.8); ctx.lineTo(8, -2.6); ctx.lineTo(14, 0); ctx.lineTo(8, 2.2); ctx.lineTo(-4, 2.4);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillRect(-3, -2.4, 10, 1);
  ctx.fillStyle = "#c9a227"; ctx.fillRect(-6, -4, 2.5, 8);
  ctx.fillStyle = o.handle || "#7a5230"; ctx.fillRect(-14, -2.2, 8.5, 4.4);
  ctx.restore();
}

// Procedural stick figure, feet anchored at (cx, bottom). Arm and knife angles are world angles.
function drawFigure(ctx, o) {
  const s = o.s || 1, f = o.facing, rot = o.rot || 0;
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(o.cx, o.bottom);
  ctx.rotate(rot);
  ctx.scale(s, s);
  const col = o.flash ? "#ffffff" : o.color;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const hipY = -44, shY = -62, headY = -79;

  // legs + torso
  ctx.beginPath();
  for (const side of [1, -1]) {
    let a = 0.13 * side, bend = 0;
    if (!o.onGround) { a = 0.45 * side; bend = 0.9; }
    else if (o.moving) {
      const ph = o.run + (side > 0 ? 0 : Math.PI);
      a = Math.sin(ph) * 0.65;
      bend = Math.max(0, -Math.cos(ph)) * 0.9;
    }
    const kx = Math.sin(a) * 22 * f, ky = hipY + Math.cos(a) * 22, sa = a - bend;
    ctx.moveTo(0, hipY);
    ctx.lineTo(kx, ky);
    ctx.lineTo(kx + Math.sin(sa) * 22 * f, ky + Math.cos(sa) * 22);
  }
  ctx.moveTo(0, hipY);
  ctx.lineTo(0, shY - 4);
  ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(0, headY, 13, 0, Math.PI * 2); ctx.stroke();
  // arms
  const hand = a => ({ x: Math.cos(a - rot) * 28, y: shY + Math.sin(a - rot) * 28 });
  const hb = hand(o.armB), hf = hand(o.armF);
  ctx.beginPath();
  ctx.moveTo(0, shY); ctx.lineTo(hb.x, hb.y);
  ctx.moveTo(0, shY); ctx.lineTo(hf.x, hf.y);
  ctx.stroke();
  if (o.fists) for (const h of [hb, hf]) { ctx.beginPath(); ctx.arc(h.x, h.y, 4.5, 0, Math.PI * 2); ctx.fill(); }
  if (o.knife != null) {
    const ka = o.knife - rot;
    drawKnife(ctx, hf.x + Math.cos(ka) * 9, hf.y + Math.sin(ka) * 9, ka, { glow: o.knifeGlow });
  }
  if (o.shield) {
    ctx.fillStyle = o.flash ? "#ffffff" : "#5b6b85";
    ctx.strokeStyle = "#cfd8e8"; ctx.lineWidth = 2;
    rrect(ctx, f > 0 ? 8 : -18, -72, 10, 62, 3);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#cfd8e8";
    for (const ry of [-62, -41, -20]) { ctx.beginPath(); ctx.arc(f > 0 ? 13 : -13, ry, 1.5, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}

function surfaceBelow(x, bottom) {
  let best = GROUND_Y;
  for (const p of PLATFORMS) if (!p.ground && x > p.x && x < p.x + p.w && p.y >= bottom - 2 && p.y < best) best = p.y;
  return best;
}
function drawShadow(cx, bottom, s = 1) {
  const sy = surfaceBelow(cx, bottom);
  const k = Math.max(0.25, 1 - (sy - bottom) / 400);
  ctx.fillStyle = `rgba(0,0,0,${0.28 * k})`;
  ctx.beginPath();
  ctx.ellipse(cx, sy + 3, 24 * k * s, 5 * k, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBackdrop() {
  ctx.fillStyle = "rgba(255,255,255,.03)";
  for (let i = 0; i < 5; i++) ctx.fillRect(60 + i * 200, 90, 60, 320);
  ctx.fillStyle = "rgba(255,244,214,.12)";
  ctx.beginPath(); ctx.arc(790, 95, 42, 0, Math.PI * 2); ctx.fill();
}

function drawPlatforms() {
  for (const p of PLATFORMS) {
    ctx.fillStyle = p.ground ? "#39445e" : "#414e6c";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "rgba(255,255,255,.08)";
    ctx.fillRect(p.x, p.y, p.w, 3);
  }
}

function drawRail() {
  ctx.fillStyle = "#2a3245";
  ctx.fillRect(0, RAIL_Y - 3, W, 6);
  ctx.fillStyle = "rgba(255,255,255,.07)";
  ctx.fillRect(0, RAIL_Y - 3, W, 1);
  ctx.fillStyle = "#2a3245";
  for (const x of [40, W / 2, W - 40]) ctx.fillRect(x - 2, 0, 4, RAIL_Y);
}

function drawRangeProps() {
  // Wooden backstop on the far wall
  ctx.fillStyle = "#4a3826";
  ctx.fillRect(W - 14, 40, 14, GROUND_Y - 40);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  for (let y = 40; y < GROUND_Y; y += 36) ctx.fillRect(W - 14, y, 14, 2);
  // Throw line
  ctx.strokeStyle = "rgba(255,255,255,.18)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.moveTo(RANGE_ZONE, GROUND_Y - 150); ctx.lineTo(RANGE_ZONE, GROUND_Y); ctx.stroke();
  ctx.setLineDash([]);
  text("THROW LINE", RANGE_ZONE, GROUND_Y - 158, { size: 10, weight: 700, color: "rgba(255,255,255,.3)", align: "center", spacing: 2 });
}

function drawWorld() {
  const g = game;
  drawBackdrop();
  if (g.targets.some(t => t instanceof Board && (t.motion === "rail" || t.motion === "swing"))) drawRail();
  for (const t of g.targets) t.draw(ctx);
  // Knives buried in the ground and walls go behind the surfaces so the blades look sunk in.
  for (const k of g.knives) if (k.state === "stuck" && (k.host.kind === "ground" || k.host.kind === "wall")) k.draw(ctx);
  if (g.mode === "range") drawRangeProps();
  drawPlatforms();
  for (const k of g.knives) if (k.state === "stuck" && k.host.kind === "target") k.draw(ctx);
  drawShadow(g.player.cx, g.player.bottom);
  for (const e of g.enemies) if (!e.dead) drawShadow(e.cx, e.bottom, e.s);
  for (const p of g.pickups) p.draw(ctx);
  for (const e of g.enemies) e.draw(ctx);
  for (const k of g.knives) if (k.state === "stuck" && k.host.kind === "enemy") k.draw(ctx);
  g.player.draw(ctx);
  for (const k of g.knives) if (k.state !== "stuck") k.draw(ctx);

  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.lineJoin = "round";
  for (const fl of g.floaters) {
    ctx.globalAlpha = Math.min(1, fl.t / 20);
    ctx.font = `800 ${fl.size}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 4;
    ctx.strokeText(fl.txt, fl.x, fl.y);
    ctx.fillStyle = fl.col;
    ctx.fillText(fl.txt, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
  if (g.state === "play") drawAimPreview();
}

function drawAimPreview() {
  const p = game.player;
  if (p.dead || !game.canThrow) return;
  const a = p.aimAngle(), s = p.shoulder;
  const c = p.charging ? p.charge : 0, sp = p.throwSpeed(c);
  let x = s.x + Math.cos(a) * 22, y = s.y + Math.sin(a) * 22;
  let vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
  ctx.fillStyle = c >= 1 ? "#ff9d5c" : "#ffffff";
  for (let i = 1; i <= 24; i++) {
    x += vx; y += vy; vy += KNIFE.gravity;
    if (y > GROUND_Y || x < 0 || x > W) break;
    if (i % 2) continue;
    ctx.globalAlpha = (1 - i / 24) * (p.hasKnives ? 0.55 : 0.15);
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCrosshair() {
  const x = clamp(mouse.x, 0, W), y = clamp(mouse.y, 0, H);
  const empty = game.state === "play" && !game.player.hasKnives;
  ctx.strokeStyle = empty ? "#ff6b6b" : "rgba(255,255,255,.9)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.moveTo(x - 15, y); ctx.lineTo(x - 11, y);
  ctx.moveTo(x + 11, y); ctx.lineTo(x + 15, y);
  ctx.moveTo(x, y - 15); ctx.lineTo(x, y - 11);
  ctx.moveTo(x, y + 11); ctx.lineTo(x, y + 15);
  ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.fillRect(x - 1, y - 1, 2, 2);
}

function drawHUD() {
  const g = game, p = g.player;
  ctx.textBaseline = "alphabetic";
  // Left: hearts, knife belt, power-up
  let y = 30;
  if (g.mode === "survival") {
    for (let i = 0; i < MAX_HP; i++) drawHeart(ctx, 30 + i * 26, y, 9, i < p.hp ? "#ff5d6c" : "rgba(255,255,255,.14)");
    y += 36;
    for (let i = 0; i < BELT_MAX; i++) {
      ctx.globalAlpha = i < p.belt ? 1 : 0.18;
      drawKnife(ctx, 26 + i * 15, y, -Math.PI / 2);
    }
    ctx.globalAlpha = 1;
    if (p.belt === 0) text("OUT — PICK UP KNIVES", 26 + BELT_MAX * 15 + 4, y + 5, { size: 11, weight: 800, color: "#ff7b7b", spacing: 1 });
  } else {
    drawKnife(ctx, 26, y + 2, -Math.PI / 2);
    text("∞", 40, y + 10, { size: 22, weight: 700, color: "#cfd8e8" });
  }
  if (p.power) {
    const def = PICKUPS[p.power.type];
    text(`${p.power.type === "triple" ? "TRIPLE" : "PIERCE"} ×${p.power.n}`, 18, y + 38, { size: 13, weight: 800, color: def.col, spacing: 2 });
  }

  // Center: wave or timer
  if (g.mode === "survival") {
    text(`WAVE ${g.wave}`, W / 2, 32, { size: 20, weight: 800, align: "center", spacing: 3 });
    const left = g.spawnQueue.length + g.enemies.filter(e => !e.dead).length;
    if (g.phase === "fight" || g.phase === "intro") {
      text(`${left} attacker${left === 1 ? "" : "s"} left`, W / 2, 50, { size: 12, color: "rgba(223,230,242,.6)", align: "center", spacing: 1 });
    }
  } else {
    const secs = Math.max(0, Math.ceil(g.timeLeft / 60));
    const low = secs <= 10 && g.phase === "fight";
    text(`0:${String(secs).padStart(2, "0")}`, W / 2, 38, {
      size: 30, weight: 800, align: "center", spacing: 2,
      color: low && Math.floor(g.t / 15) % 2 ? "#ff5d5d" : "#dfe6f2",
    });
  }

  // Right: score, best, combo
  text(g.score.toLocaleString(), W - 22, 38, { size: 28, weight: 800, align: "right" });
  text(`BEST ${Math.max(g.best[g.mode], g.score).toLocaleString()}`, W - 22, 56, { size: 11, weight: 700, align: "right", color: "rgba(223,230,242,.5)", spacing: 2 });
  if (g.combo >= 2) {
    text(`×${g.mult}`, W - 22, 90, { size: 24, weight: 800, align: "right", color: g.mult > 1 ? "#ff9d5c" : "#cfd8e8" });
    text(`${g.combo} HIT COMBO`, W - 22, 106, { size: 11, weight: 700, align: "right", color: "rgba(223,230,242,.6)", spacing: 1 });
  }
  if (sfx.muted) text("MUTED", W - 14, H - 12, { size: 11, weight: 700, align: "right", color: "rgba(223,230,242,.45)", spacing: 2 });

  // Danger edge when on the last heart
  if (g.mode === "survival" && p.hp === 1 && !p.dead) {
    ctx.strokeStyle = `rgba(255,60,80,${0.22 + 0.18 * Math.sin(g.t * 0.15)})`;
    ctx.lineWidth = 10;
    ctx.strokeRect(0, 0, W, H);
  }
}

function drawBanner() {
  const b = game.banner;
  if (!b) return;
  const a = clamp(Math.min(b.t / 8, (b.dur - b.t) / 15), 0, 1);
  const sc = 1 + Math.max(0, 1 - b.t / 10) * 0.35;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, H * 0.36);
  ctx.scale(sc, sc);
  text(b.title, 0, 0, { size: 52, weight: 800, align: "center", color: "#ffffff", spacing: 6, shadow: true });
  if (b.sub) text(b.sub, 0, 34, { size: 17, weight: 600, align: "center", color: "#cfd8e8", shadow: true });
  ctx.restore();
}

function drawPause() {
  ctx.fillStyle = "rgba(8,10,16,.6)";
  ctx.fillRect(0, 0, W, H);
  text("PAUSED", W / 2, H / 2 - 10, { size: 48, weight: 800, align: "center", spacing: 6 });
  text("P or click to resume  ·  R to restart  ·  Esc for menu", W / 2, H / 2 + 26, { size: 15, align: "center", color: "#b9c4d8" });
}

function drawOver() {
  const g = game, s = g.stats;
  ctx.fillStyle = "rgba(8,10,16,.72)";
  ctx.fillRect(0, 0, W, H);
  const pw = 440, ph = 350, px = W / 2 - pw / 2, py = 88;
  rrect(ctx, px, py, pw, ph, 14);
  ctx.fillStyle = "rgba(26,32,48,.96)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.stroke();

  text(g.mode === "survival" ? "GAME OVER" : "TIME'S UP", W / 2, py + 50, {
    size: 30, weight: 800, align: "center", spacing: 5, color: g.mode === "survival" ? "#ff5d5d" : "#ffd84d",
  });
  text(g.score.toLocaleString(), W / 2, py + 108, { size: 50, weight: 800, align: "center" });
  if (g.newBest) text("NEW BEST!", W / 2, py + 134, { size: 14, weight: 800, align: "center", color: "#ffd84d", spacing: 3 });
  else text(`BEST ${g.best[g.mode].toLocaleString()}`, W / 2, py + 134, { size: 12, weight: 700, align: "center", color: "rgba(223,230,242,.5)", spacing: 2 });

  const acc = s.throws ? Math.round(s.hits / s.throws * 100) : 0;
  const rows = g.mode === "survival"
    ? [["Wave reached", g.wave], ["Attackers dropped", s.kills], ["Headshots", s.headshots], ["Accuracy", acc + "%"], ["Best combo", s.bestCombo]]
    : [["Knives thrown", s.throws], ["Accuracy", acc + "%"], ["Bullseyes", s.bulls], ["Apples", s.apples], ["Best combo", s.bestCombo]];
  rows.forEach(([label, val], i) => {
    const ry = py + 176 + i * 26;
    text(label, px + 70, ry, { size: 15, color: "#b9c4d8" });
    text(String(val), px + pw - 70, ry, { size: 15, weight: 800, align: "right" });
  });
  if (g.overT > 40) {
    text("Click or press Enter to play again  ·  Esc for menu", W / 2, py + ph - 22, { size: 13, align: "center", color: "rgba(223,230,242,.6)" });
  }
}

function drawMenu() {
  drawBackdrop();
  // Practice board with a couple of knives in it
  const bx = 850, by = GROUND_Y - 100;
  ctx.fillStyle = "#5a4128"; ctx.fillRect(bx - 3, by, 6, GROUND_Y - by);
  for (const [r, c] of [[33, "#6b4a2a"], [30, "#efe8da"], [24, "#d8433a"], [15, "#efe8da"], [6.6, "#ffcf3f"]]) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  }
  drawKnife(ctx, bx - 14, by - 2, 0.15);
  drawKnife(ctx, bx - 18, by + 12, -0.2);
  drawPlatforms();

  // Juggler
  const t = game.t, cx = W / 2, bottom = GROUND_Y;
  const armF = -0.6 + Math.sin(t * 0.15) * 0.15, armB = Math.PI + 0.6 + Math.cos(t * 0.15) * 0.15;
  drawShadow(cx, bottom);
  drawFigure(ctx, { cx, bottom, facing: 1, color: "#6fb6ff", onGround: true, armF, armB, knife: null });
  const sy = bottom - 62;
  const hR = { x: cx + Math.cos(armF) * 28, y: sy + Math.sin(armF) * 28 };
  const hL = { x: cx + Math.cos(armB) * 28, y: sy + Math.sin(armB) * 28 };
  for (let i = 0; i < 3; i++) {
    const ph = (t * 0.012 + i / 3) % 1, ltr = ph < 0.5, q = (ph % 0.5) * 2;
    const from = ltr ? hL : hR, to = ltr ? hR : hL;
    const x = lerp(from.x, to.x, q), y = lerp(from.y, to.y, q) - Math.sin(q * Math.PI) * (ltr ? 64 : 46);
    drawKnife(ctx, x, y, t * 0.16 + i * 2.1);
  }

  text("KNIFE THROWER", W / 2, 84, { size: 54, weight: 800, align: "center", spacing: 8, shadow: true });
  text("aim · throw · stick it · get your knives back", W / 2, 112, { size: 15, align: "center", color: "rgba(223,230,242,.6)", spacing: 2 });

  for (const c of MENU_CARDS) {
    const hover = inRect(mouse.x, mouse.y, c);
    const y = c.y - (hover ? 3 : 0);
    rrect(ctx, c.x, y, c.w, c.h, 12);
    ctx.fillStyle = hover ? "rgba(40,50,72,.95)" : "rgba(26,32,48,.85)";
    ctx.fill();
    ctx.strokeStyle = hover ? "#ff5d5d" : "rgba(255,255,255,.12)";
    ctx.lineWidth = hover ? 2 : 1;
    ctx.stroke();
    text(c.title, c.x + 22, y + 40, { size: 22, weight: 800, spacing: 3 });
    text(c.key, c.x + c.w - 22, y + 38, { size: 14, weight: 800, align: "right", color: "rgba(223,230,242,.35)" });
    c.lines.forEach((l, i) => text(l, c.x + 22, y + 68 + i * 20, { size: 14, color: "#b9c4d8" }));
    text(`BEST ${game.best[c.mode].toLocaleString()}`, c.x + 22, y + c.h - 18, { size: 11, weight: 700, color: "rgba(223,230,242,.45)", spacing: 2 });
  }
  text("Click a mode or press 1 / 2", W / 2, 306, { size: 13, align: "center", color: "rgba(223,230,242,.45)", spacing: 1 });
  text("Aim with the mouse · click to throw, hold for power · A/D move · W jump · S drop", W / 2, 512, {
    size: 12, align: "center", color: "rgba(223,230,242,.5)",
  });
}

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (game.state === "menu") {
    drawMenu();
    drawCrosshair();
    return;
  }
  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-0.5, 0.5) * game.shake, rand(-0.5, 0.5) * game.shake);
  drawWorld();
  ctx.restore();
  if (game.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,60,${game.hurtFlash / 18 * 0.22})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  drawBanner();
  if (game.state === "paused") drawPause();
  if (game.state === "over") drawOver();
  drawCrosshair();
}

fit();
addEventListener("resize", fit);
requestAnimationFrame(loop);
</script>
</body>
</html>
